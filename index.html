<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewMate — AI Question Generator & Candidate Evaluation Platform</title>
    <!-- Tailwind CSS & React CDN Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @keyframes pretzelWiggle {
        0%, 100% { transform: rotate(0deg) scale(1); }
        20% { transform: rotate(-12deg) scale(1.2); }
        40% { transform: rotate(12deg) scale(1.2); }
        60% { transform: rotate(-8deg) scale(1.1); }
        80% { transform: rotate(8deg) scale(1.1); }
      }
      .pretzel-anim {
        display: inline-block;
        animation: pretzelWiggle 3s infinite ease-in-out;
        transform-origin: center;
      }
      @media print {
        header, nav, button, footer, .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
        .print-card { border: 1px solid #cbd5e1 !important; box-shadow: none !important; break-inside: avoid; }
      }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEPARTMENT_POSITIONS = {
      'Information Technology': ['Software Engineer', 'Senior Full Stack Developer', 'Frontend Developer', 'Backend Architect', 'DevOps Engineer', 'Data Analyst', 'Systems Administrator', 'Product Manager'],
      'Human Resources': ['HR Manager', 'Talent Acquisition Specialist', 'HR Business Partner', 'Recruiter', 'Compensation & Benefits Analyst'],
      'Finance & Accounting': ['Financial Analyst', 'Senior Accountant', 'Finance Manager', 'Internal Auditor', 'Payroll Specialist'],
      'Marketing': ['Digital Marketing Specialist', 'Content Marketing Manager', 'SEO & SEM Specialist', 'Brand Manager'],
      'Sales': ['Sales Executive', 'Account Manager', 'Business Development Manager', 'Enterprise Account Executive'],
      'Operations': ['Operations Manager', 'Supply Chain Analyst', 'Logistics Coordinator', 'Process Improvement Specialist'],
      'Customer Service': ['Customer Support Specialist', 'Customer Success Manager', 'Support Team Lead'],
      'Administration': ['Executive Assistant', 'Office Manager', 'Administrative Assistant'],
      'Engineering': ['Mechanical Engineer', 'Electrical Engineer', 'QA Automation Engineer', 'Civil Engineer'],
      'Other / Custom': ['Custom Position']
    };

    const SENIORITY_LEVELS = ['Internship', 'Entry Level', 'Junior', 'Mid-Level', 'Senior', 'Manager', 'Director / Executive'];

    const SCRUTINY_LEVELS = [
      { id: 'lenient', title: 'Lenient / Encouraging', desc: 'Generous scoring (3-5). Gives benefit of the doubt for junior roles.' },
      { id: 'balanced', title: 'Balanced (Standard Corp)', desc: 'Standard corporate evaluation. Requires clear STAR examples for 4+.' },
      { id: 'strict', title: 'Strict (High-Bar Senior)', desc: 'High expectations. Caps vague or unquantified answers at 2 or 3.' },
      { id: 'ruthless', title: 'Ruthless (Bar Raiser)', desc: 'Extremely rigorous. Scores 4 and 5 reserved strictly for top candidates.' }
    ];

    const DEFAULT_PRESETS = [
      { id: 'preset-1', title: 'Senior Frontend Developer', department: 'Information Technology', position: 'Frontend Developer', seniority: 'Senior', composition: { General: 1, Technical: 3, Behavioral: 1 }, additionalContext: 'Focus on React 18, TypeScript, System Architecture, and Web Performance.' },
      { id: 'preset-2', title: 'HR Business Partner', department: 'Human Resources', position: 'HR Business Partner', seniority: 'Mid-Level', composition: { General: 1, Behavioral: 2, Situational: 2 }, additionalContext: 'Focus on Conflict Resolution, Leadership Coaching, and Talent Retention.' },
      { id: 'preset-3', title: 'Financial Analyst', department: 'Finance & Accounting', position: 'Financial Analyst', seniority: 'Mid-Level', composition: { Technical: 3, Competency: 2 }, additionalContext: 'Financial Modeling, DCF Valuation, Budget Forecasting, and Advanced Excel.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [outputLang, setOutputLang] = useState('en'); // 'en' | 'id'
      const [studioViewMode, setStudioViewMode] = useState('studio'); // 'studio' | 'compact'
      const [cheatsheetDetail, setCheatsheetDetail] = useState('full'); // 'only_questions' | 'rubrics' | 'full'
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('interviewmate_gemini_key') || '');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [scrutinyMode, setScrutinyMode] = useState('balanced');
      const [copyStatus, setCopyStatus] = useState('');
      
      const [presets, setPresets] = useState(() => {
        const saved = localStorage.getItem('interviewmate_presets');
        return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
      });

      const [editingPreset, setEditingPreset] = useState(null);

      const [config, setConfig] = useState({
        department: 'Information Technology',
        position: 'Software Engineer',
        customPosition: '',
        seniority: 'Mid-Level',
        composition: {
          General: 1,
          Technical: 2,
          Behavioral: 2,
          Situational: 0,
          Competency: 0,
          Leadership: 0
        },
        additionalContext: ''
      });

      const [generatedKit, setGeneratedKit] = useState(null);
      const [candidateScores, setCandidateScores] = useState({});
      const [candidateNotes, setCandidateNotes] = useState({});
      const [aiAnswerReviews, setAiAnswerReviews] = useState({});
      const [reviewingIndex, setReviewingIndex] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      // Max 10 questions composition calculation
      const totalQuestionsCount = useMemo(() => {
        return Object.values(config.composition).reduce((a, b) => a + Number(b), 0);
      }, [config.composition]);

      const handleCompositionChange = (type, val) => {
        const parsedVal = Math.max(0, parseInt(val) || 0);
        const currentOthersTotal = Object.entries(config.composition)
          .filter(([k]) => k !== type)
          .reduce((sum, [_, count]) => sum + Number(count), 0);
        
        // Cap total at 10 max
        const allowedVal = Math.min(parsedVal, 10 - currentOthersTotal);
        setConfig(prev => ({
          ...prev,
          composition: { ...prev.composition, [type]: allowedVal }
        }));
      };

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('interviewmate_gemini_key', key);
      };

      const handleScoreChange = (qIndex, score) => {
        setCandidateScores(prev => ({ ...prev, [qIndex]: score }));
      };

      const handleNoteChange = (qIndex, note) => {
        setCandidateNotes(prev => ({ ...prev, [qIndex]: note }));
      };

      const handleUpdateQuestion = (qIndex, field, value) => {
        if (!generatedKit) return;
        const updatedQuestions = [...generatedKit.questions];
        updatedQuestions[qIndex] = { ...updatedQuestions[qIndex], [field]: value };
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleAddCustomQuestion = () => {
        if (!generatedKit) return;
        if (generatedKit.questions.length >= 10) {
          alert('Maximum limit of 10 questions reached per kit.');
          return;
        }
        const newQ = {
          id: `q-custom-${Date.now()}`,
          category: 'Custom',
          question: outputLang === 'id' ? 'Pertanyaan kustom baru...' : 'New custom question...',
          purpose: outputLang === 'id' ? 'Menilai kriteria khusus.' : 'Evaluates specific custom role criteria.',
          greenFlags: [outputLang === 'id' ? 'Penjelasan terstruktur' : 'Structured explanation'],
          redFlags: [outputLang === 'id' ? 'Penjelasan kabur' : 'Vague answer'],
          rubricMatrix: {
            1: outputLang === 'id' ? 'Tidak memenuhi' : 'Does not meet expectations',
            3: outputLang === 'id' ? 'Memenuhi standar' : 'Meets expectations',
            5: outputLang === 'id' ? 'Luar biasa' : 'Exceptional'
          }
        };
        setGeneratedKit({ ...generatedKit, questions: [...generatedKit.questions, newQ] });
      };

      const handleDeleteQuestion = (qIndex) => {
        if (!generatedKit) return;
        const updatedQuestions = generatedKit.questions.filter((_, i) => i !== qIndex);
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleRegenerateSingleQuestion = async (qIndex) => {
        if (!generatedKit) return;
        const qToReplace = generatedKit.questions[qIndex];
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';

        if (apiKey) {
          try {
            const prompt = `Generate 1 alternative ${qToReplace.category} interview question in ${targetLangStr} for a ${generatedKit.seniority} level ${generatedKit.position}.
Return ONLY valid JSON matching:
{
  "category": "${qToReplace.category}",
  "question": "Question text",
  "purpose": "Purpose",
  "greenFlags": ["Flag 1", "Flag 2"],
  "redFlags": ["Flag 1", "Flag 2"],
  "rubricMatrix": {"1": "Poor", "3": "Meets", "5": "Excellent"}
}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const parsed = JSON.parse(textResponse.replace(/```json/g, '').replace(/```/g, '').trim());
            
            const updatedQuestions = [...generatedKit.questions];
            updatedQuestions[qIndex] = { ...parsed, id: `q-regen-${Date.now()}` };
            setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
            return;
          } catch(err) {
            console.warn("Single regen fallback", err);
          }
        }

        const updatedQuestions = [...generatedKit.questions];
        updatedQuestions[qIndex] = {
          ...qToReplace,
          question: outputLang === 'id' 
            ? `[Alternatif] Bagaimana Anda mengelola prioritas utama dalam peran ${generatedKit.position}?`
            : `[Alternative] How do you manage critical priorities in your role as ${generatedKit.position}?`,
          id: `q-regen-${Date.now()}`
        };
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleReviewAnswerWithAI = async (qIndex) => {
        const note = candidateNotes[qIndex];
        if (!note || !note.trim()) return;
        setReviewingIndex(qIndex);

        const questionObj = generatedKit.questions[qIndex];
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';

        if (apiKey) {
          try {
            const prompt = `You are an executive interviewer with Scrutiny Level: ${scrutinyMode}.
Question: "${questionObj.question}"
Candidate Transcript Notes: "${note}"
Rubrics: Score 1: ${questionObj.rubricMatrix[1]}, Score 3: ${questionObj.rubricMatrix[3]}, Score 5: ${questionObj.rubricMatrix[5]}

Analyze the notes in ${targetLangStr}. Return ONLY valid JSON:
{
  "suggestedScore": 3,
  "strengthsFound": ["Strength 1", "Strength 2"],
  "gapsFound": ["Gap 1"],
  "suggestedFollowUp": "Follow-up question"
}`;
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const parsed = JSON.parse(textResponse.replace(/```json/g, '').replace(/```/g, '').trim());

            setAiAnswerReviews(prev => ({ ...prev, [qIndex]: parsed }));
            if (parsed.suggestedScore) handleScoreChange(qIndex, parsed.suggestedScore);
            setReviewingIndex(null);
            return;
          } catch (err) {
            console.warn("AI Review Fallback", err);
          }
        }

        setTimeout(() => {
          const mockResult = {
            suggestedScore: Math.min(5, Math.max(2, Math.floor(note.length / 25))),
            strengthsFound: outputLang === 'id' ? ['Menyebutkan konteks terstruktur', 'Menjelaskan alur tindakan'] : ['Mentions structured context', 'Explains action methodology'],
            gapsFound: outputLang === 'id' ? ['Dapat menambahkan metrik hasil bisnis terukur'] : ['Could include more specific quantified business impact'],
            suggestedFollowUp: outputLang === 'id' ? 'Apa metrik utama yang Anda gunakan untuk mengukur keberhasilan tersebut?' : 'What key metric did you use to measure that success?'
          };
          setAiAnswerReviews(prev => ({ ...prev, [qIndex]: mockResult }));
          handleScoreChange(qIndex, mockResult.suggestedScore);
          setReviewingIndex(null);
        }, 1000);
      };

      const handleCopyCheatsheet = () => {
        if (!generatedKit) return;
        let text = `INTERVIEW QUESTION CHEATSHEET\nPosition: ${generatedKit.position} (${generatedKit.seniority})\nLanguage: ${outputLang === 'id' ? 'Bahasa Indonesia' : 'English'}\nDate: ${new Date().toLocaleDateString()}\n\n`;

        generatedKit.questions.forEach((q, idx) => {
          text += `Q${idx + 1} [${q.category}]: ${q.question}\n`;
          
          if (cheatsheetDetail !== 'only_questions') {
            text += `Purpose: ${q.purpose}\n`;
            text += `Rubric Scores:\n`;
            text += `  [1 - Poor]: ${q.rubricMatrix?.[1] || 'Does not meet standards'}\n`;
            text += `  [3 - Meets]: ${q.rubricMatrix?.[3] || 'Meets expectations'}\n`;
            text += `  [5 - Excellent]: ${q.rubricMatrix?.[5] || 'Exceptional mastery'}\n`;
          }

          if (cheatsheetDetail === 'full') {
            text += `Green Flags: ${q.greenFlags ? q.greenFlags.join('; ') : 'N/A'}\n`;
            text += `Red Flags: ${q.redFlags ? q.redFlags.join('; ') : 'N/A'}\n`;
          }
          text += `--------------------------------------------------\n\n`;
        });

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            setCopyStatus(outputLang === 'id' ? 'Tersalin!' : 'Copied!');
            setTimeout(() => setCopyStatus(''), 3000);
          });
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          setCopyStatus(outputLang === 'id' ? 'Tersalin!' : 'Copied!');
          setTimeout(() => setCopyStatus(''), 3000);
        }
      };

      const computeOverallStats = useMemo(() => {
        const scores = Object.values(candidateScores).filter(s => typeof s === 'number');
        if (scores.length === 0) return { avgScore: '0.0', count: 0, recommendation: outputLang === 'id' ? 'Menunggu Penilaian' : 'Pending Ratings' };
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / scores.length).toFixed(1);
        
        let recommendation = outputLang === 'id' ? 'Tidak Direkomendasikan' : 'Not Recommended';
        if (avg >= 4.5) recommendation = outputLang === 'id' ? 'Sangat Direkomendasikan' : 'Strongly Recommended';
        else if (avg >= 3.6) recommendation = outputLang === 'id' ? 'Direkomendasikan' : 'Recommended';
        else if (avg >= 2.8) recommendation = outputLang === 'id' ? 'Perlu Evaluasi Lanjutan' : 'Further Evaluation Needed';

        return { avgScore: avg, count: scores.length, recommendation };
      }, [candidateScores, outputLang]);

      const generateInterviewQuestions = async () => {
        setIsGenerating(true);
        const targetPosition = config.department === 'Other / Custom' ? (config.customPosition || 'Custom Role') : config.position;
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';
        
        const compositionText = Object.entries(config.composition)
          .filter(([_, count]) => count > 0)
          .map(([type, count]) => `${count} ${type} Questions`)
          .join(', ');

        if (apiKey) {
          try {
            const prompt = `Generate a structured interview question kit strictly in ${targetLangStr} for a ${config.seniority} level ${targetPosition} in ${config.department}.
Composition: ${compositionText} (Total ${totalQuestionsCount} questions, max 10).
Context: ${config.additionalContext}

Return ONLY valid JSON in ${targetLangStr} matching:
{
  "questions": [
    {
      "id": "q1",
      "category": "Technical",
      "question": "Question text in ${targetLangStr}",
      "purpose": "Purpose in ${targetLangStr}",
      "greenFlags": ["Indicator 1", "Indicator 2"],
      "redFlags": ["Warning sign 1", "Warning sign 2"],
      "rubricMatrix": {
        "1": "Description for Poor (1)",
        "3": "Description for Meets Expectations (3)",
        "5": "Description for Excellent (5)"
      }
    }
  ]
}`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await res.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const cleanedJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(cleanedJson);

            setGeneratedKit({
              position: targetPosition,
              seniority: config.seniority,
              questions: parsed.questions.slice(0, 10)
            });
            setActiveTab('studio');
            setIsGenerating(false);
            return;
          } catch (err) {
            console.warn("AI Generation fallback triggered:", err);
          }
        }

        // Offline Fallback
        setTimeout(() => {
          const generatedQuestions = [];
          Object.entries(config.composition).forEach(([type, count]) => {
            for (let i = 0; i < count; i++) {
              if (generatedQuestions.length >= 10) break;
              generatedQuestions.push({
                id: `q-${type}-${i+1}`,
                category: type,
                question: outputLang === 'id' 
                  ? `[${type}] Jelaskan pengalaman Anda sebagai ${config.seniority} ${targetPosition} terkait tantangan utama dalam bidang ini.`
                  : `[${type}] Describe your experience as a ${config.seniority} ${targetPosition} regarding key operational challenges.`,
                purpose: outputLang === 'id' ? `Menilai kompetensi ${type} untuk posisi ${targetPosition}.` : `Evaluates ${type} competencies for ${targetPosition}.`,
                greenFlags: outputLang === 'id' ? ['Menggunakan metode STAR dengan detail', 'Memberikan contoh angka/metrik hasil'] : ['Uses STAR method with specific details', 'Provides quantified metric results'],
                redFlags: outputLang === 'id' ? ['Jawaban terlalu umum tanpa bukti', 'Menyalahkan tim atas kegagalan'] : ['Generic answers without concrete evidence', 'Blames team members for failures'],
                rubricMatrix: {
                  1: outputLang === 'id' ? 'Jawaban kabur tanpa penjelasan konkret.' : 'Vague answer with no concrete evidence.',
                  3: outputLang === 'id' ? 'Memenuhi standar dasar dengan alur yang jelas.' : 'Meets baseline standards with clear methodology.',
                  5: outputLang === 'id' ? 'Luar biasa dengan dampak bisnis terukur.' : 'Exceptional answer with clear ROI and impact.'
                }
              });
            }
          });

          setGeneratedKit({
            position: targetPosition,
            seniority: config.seniority,
            questions: generatedQuestions
          });
          setActiveTab('studio');
          setIsGenerating(false);
        }, 1000);
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            {/* Header Bar */}
            <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
              <div className="max-w-7xl mx-auto px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">M</div>
                  <div>
                    <h1 className="font-bold text-lg leading-tight tracking-wide">InterviewMate</h1>
                    <p className="text-xs text-slate-400">AI Question Generator & Candidate Scorecards</p>
                  </div>
                </div>

                {/* Navigation Links */}
                <nav className="flex items-center space-x-1.5 text-xs font-semibold overflow-x-auto py-1">
                  <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>Dashboard</button>
                  <button onClick={() => setActiveTab('generator')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'generator' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>1. Generator</button>
                  <button onClick={() => setActiveTab('studio')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'studio' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>2. Question Studio</button>
                  <button onClick={() => setActiveTab('live-interview')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'live-interview' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>3. Live Interview</button>
                  <button onClick={() => setActiveTab('scorecard')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'scorecard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>4. Scorecard</button>
                  <button onClick={() => setActiveTab('about')} className={`px-3 py-2 rounded-xl transition ${activeTab === 'about' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:bg-slate-800'}`}>About & Guide</button>
                </nav>

                {/* Controls: AI Output Language Toggle & API Key */}
                <div className="flex items-center space-x-2">
                  <div className="flex items-center bg-slate-800 p-1 border border-slate-700 rounded-xl text-xs font-bold">
                    <span className="px-2 text-slate-400">AI Output:</span>
                    <button onClick={() => setOutputLang('en')} className={`px-2.5 py-1 rounded-lg transition ${outputLang === 'en' ? 'bg-indigo-600 text-white' : 'text-slate-300'}`}>EN</button>
                    <button onClick={() => setOutputLang('id')} className={`px-2.5 py-1 rounded-lg transition ${outputLang === 'id' ? 'bg-indigo-600 text-white' : 'text-slate-300'}`}>ID</button>
                  </div>
                  <button onClick={() => setShowApiKeyModal(true)} className="px-3 py-1.5 rounded-xl border border-slate-700 hover:border-slate-500 text-xs font-semibold flex items-center space-x-2 text-slate-300 bg-slate-800/60 transition">
                    <span className={`w-2.5 h-2.5 rounded-full ${apiKey ? 'bg-emerald-400 shadow-sm' : 'bg-amber-400'}`}></span>
                    <span>{apiKey ? 'API Key Active' : 'Set API Key'}</span>
                  </button>
                </div>
              </div>
            </header>

            {/* Main Workspace */}
            <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-8">

              {/* DASHBOARD TAB (Informative SaaS Hub) */}
              {activeTab === 'dashboard' && (
                <div className="space-y-8">
                  {/* Hero Banner */}
                  <div className="bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-900 text-white p-8 rounded-3xl shadow-xl border border-slate-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                    <div className="space-y-3 max-w-2xl">
                      <span className="text-xs font-bold px-3 py-1 bg-indigo-500/20 text-indigo-300 rounded-full border border-indigo-500/30">AI-Powered Hiring Studio</span>
                      <h2 className="text-3xl font-extrabold">Structured Interviewing Made Simple & Objective</h2>
                      <p className="text-slate-300 text-sm leading-relaxed">Generate role-tailored question sets (up to 10), conduct live interviews with anti-inflation scrutiny, and export executive scorecards.</p>
                    </div>
                    <button onClick={() => setActiveTab('generator')} className="px-6 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl shadow-lg transition whitespace-nowrap">
                      Start New Interview →
                    </button>
                  </div>

                  {/* Informative Platform Metrics Grid */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                      <span className="text-xs font-bold text-slate-400 uppercase">Question Cap</span>
                      <p className="text-2xl font-black text-slate-900">10 Max</p>
                      <p className="text-xs text-slate-500">Custom composition per set</p>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-1">
                      <span className="text-xs font-bold text-slate-400 uppercase">AI Scrutiny Tiers</span>
                      <p className="text-2xl font-black text-indigo-600">4 Tiers</p>
                      <p className="text-xs text-slate-500">Lenient to Ruthless / Bar Raiser</p>
                    </div>

                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>

                  {/* Candidate Areas for Improvement Table */}
                  <div className="space-y-3">
                    <h4 className="font-bold text-rose-900 text-sm">Top 3 Areas for Improvement</h4>
                    <div className="overflow-x-auto border border-rose-200 rounded-xl">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-rose-50 text-rose-900 font-bold border-b border-rose-200">
                          <tr>
                            <th className="p-3 w-1/4">Keyword</th>
                            <th className="p-3 w-1/2">Observed Evidence / Response</th>
                            <th className="p-3 w-1/4">Impact / Recommendation</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-rose-100 bg-white">
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#QuantifiedMetrics</td>
                            <td className="p-3 text-slate-600">Could provide more hard business impact data in examples.</td>
                            <td className="p-3 text-slate-500">Coach on ROI metrics</td>
                          </tr>
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#EdgeCaseHandling</td>
                            <td className="p-3 text-slate-600">Deeper elaboration needed for risk mitigation strategies.</td>
                            <td className="p-3 text-slate-500">Pair with senior mentor</td>
                          </tr>
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#DelegationDepth</td>
                            <td className="p-3 text-slate-600">Tends to focus heavily on individual effort rather than team scale.</td>
                            <td className="p-3 text-slate-500">Leadership development</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ABOUT & MULTI-PROVIDER FREE API GUIDE TAB */}
              {activeTab === 'about' && (
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-4xl mx-auto space-y-8">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">About & Free API Guide</h2>
                    <p className="text-xs text-slate-500 mt-1">AI-powered interview question generator & candidate evaluation platform.</p>
                  </div>

                  {/* Multi-Provider Free API Guide */}
                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                    <h3 className="font-bold text-slate-900 text-sm">🔑 Options for Free AI API Keys</h3>
                    <div className="space-y-4 text-xs text-slate-600 leading-relaxed">
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">1. Google AI Studio (Recommended — Free Tier)</strong>
                        <p>Google provides a 100% free API tier for Gemini 2.5 Flash with up to 15 requests/minute.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Go to <a href="https://aistudio.google.com/" target="_blank" className="text-indigo-600 underline font-semibold">aistudio.google.com</a></li>
                          <li>Sign in with your Google account and click <strong>"Create API Key"</strong>.</li>
                          <li>Paste the key into InterviewMate's API Key modal.</li>
                        </ul>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">2. Groq Cloud (Free Developer Tier)</strong>
                        <p>Groq provides free ultra-fast access to open models like Llama 3 and Mixtral.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Visit <a href="https://console.groq.com/" target="_blank" className="text-indigo-600 underline font-semibold">console.groq.com</a></li>
                          <li>Sign up for a free developer account and navigate to <strong>API Keys</strong>.</li>
                        </ul>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">3. OpenRouter (Free & Open Weights Gateway)</strong>
                        <p>OpenRouter offers access to free-tier open models with zero cost setups.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Visit <a href="https://openrouter.ai/" target="_blank" className="text-indigo-600 underline font-semibold">openrouter.ai</a></li>
                          <li>Create a key under Account Keys and filter by free model endpoints.</li>
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* Persistent Footer with Wiggling Pretzel Emoji */}
          <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 px-6 text-center text-xs no-print">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              <p className="font-medium">InterviewMate — AI Question Generator & Candidate Evaluation Platform</p>
              <p className="text-slate-300 font-bold text-sm">
                Semangat ya ❤️ <span className="pretzel-anim">🥨</span>
              </p>
            </div>
          </footer>

          {/* Edit Preset Modal */}
          {editingPreset && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Edit Preset Template</h3>
                <input type="text" value={editingPreset.title} onChange={e => setEditingPreset({ ...editingPreset, title: e.target.value })} placeholder="Preset Title..." className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
                <select value={editingPreset.department} onChange={e => setEditingPreset({ ...editingPreset, department: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl text-sm">
                  {Object.keys(DEPARTMENT_POSITIONS).map(d => <option key={d} value={d}>{d}</option>)}
                </select>
                <input type="text" value={editingPreset.position} onChange={e => setEditingPreset({ ...editingPreset, position: e.target.value })} placeholder="Position..." className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setEditingPreset(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => {
                    const updated = presets.filter(p => p.id !== editingPreset.id);
                    const newPresets = [...updated, editingPreset];
                    setPresets(newPresets);
                    localStorage.setItem('interviewmate_presets', JSON.stringify(newPresets));
                    setEditingPreset(null);
                  }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Preset</button>
                </div>
              </div>
            </div>
          )}

          {/* Multi-Provider API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Configure AI API Key</h3>
                <p className="text-xs text-slate-500">Get free keys from <strong>Google AI Studio</strong> (aistudio.google.com), <strong>Groq</strong> (console.groq.com), or <strong>OpenRouter</strong> (openrouter.ai).</p>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key (e.g., AIzaSy...)" className="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono bg-slate-50" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => { handleSaveApiKey(apiKey); setShowApiKeyModal(false); }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Key</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
