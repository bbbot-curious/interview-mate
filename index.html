      @keyframes pretzelWiggle {
        0%, 100% { transform: rotate(0deg) scale(1); }
        20% { transform: rotate(-12deg) scale(1.2); }
        40% { transform: rotate(12deg) scale(1.2); }
        60% { transform: rotate(-8deg) scale(1.1); }
        80% { transform: rotate(8deg) scale(1.1); }
      }
      .pretzel-anim {
        display: inline-block;
        animation: pretzelWiggle 3s infinite ease-in-out;
        transform-origin: center;
      }
      @media print {
        header, nav, button, footer, .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
        .print-card { border: 1px solid #cbd5e1 !important; box-shadow: none !important; break-inside: avoid; }
      }
    </style>

    // Universal AI Provider API Fetch Helper
    async function callAIProvider(prompt, apiKey, systemInstruction = "You are an expert HR interviewer.") {
      const cleanKey = apiKey ? apiKey.trim() : "";
      if (!cleanKey) {
        throw new Error("No API key provided. Please click 'Set API Key' in the top right.");
      }

      let textResult = "";

      // Provider 1: Groq Cloud (keys start with gsk_)
      if (cleanKey.startsWith("gsk_")) {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cleanKey}`
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: prompt }
            ],
            response_format: { type: "json_object" }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`Groq API Error (${res.status}): ${errData.error?.message || res.statusText}`);
        }
        const data = await res.json();
        textResult = data.choices?.[0]?.message?.content;
      }
      // Provider 2: OpenRouter (keys start with sk-or-)
      else if (cleanKey.startsWith("sk-or-")) {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cleanKey}`
          },
          body: JSON.stringify({
            model: "meta-llama/llama-3.3-70b-instruct:free",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: prompt }
            ],
            response_format: { type: "json_object" }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`OpenRouter API Error (${res.status}): ${errData.error?.message || res.statusText}`);
        }
        const data = await res.json();
        textResult = data.choices?.[0]?.message?.content;
      }
      // Provider 3: OpenAI (keys start with sk- and not sk-or-)
      else if (cleanKey.startsWith("sk-")) {
        const res = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${cleanKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              { role: "system", content: systemInstruction },
              { role: "user", content: prompt }
            ],
            response_format: { type: "json_object" }
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`OpenAI API Error (${res.status}): ${errData.error?.message || res.statusText}`);
        }
        const data = await res.json();
        textResult = data.choices?.[0]?.message?.content;
      }
      // Provider 4: Google Gemini REST API (AIza... or default)
      else {
        const modelsToTry = ["gemini-1.5-flash", "gemini-2.0-flash", "gemini-2.5-flash"];
        let lastError = null;

        for (const model of modelsToTry) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${cleanKey}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                contents: [{ parts: [{ text: `${systemInstruction}\n\n${prompt}` }] }],
                generationConfig: { responseMimeType: "application/json" }
              })
            });

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(`Gemini API (${model}) Error (${res.status}): ${errData.error?.message || res.statusText}`);
            }

            const data = await res.json();
            textResult = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (textResult) break;
          } catch (e) {
            lastError = e;
          }
        }

        if (!textResult) {
          throw lastError || new Error("Failed to receive response from Google Gemini API.");
        }
      }

      if (!textResult) throw new Error("Empty payload returned by AI provider.");
      
      // Robust JSON sanitation logic
      let cleaned = textResult.trim();
      cleaned = cleaned.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/\s*```$/i, '').trim();
      return JSON.parse(cleaned);
    }

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');

      const [scrutinyMode, setScrutinyMode] = useState('balanced');
      const [copyStatus, setCopyStatus] = useState('');
      const [apiStatusMessage, setApiStatusMessage] = useState('');
      const [apiErrorMessage, setApiErrorMessage] = useState('');

      // Pretzel Cat Easter Egg State
      const [showCatModal, setShowCatModal] = useState(false);
      const [catImageUrl, setCatImageUrl] = useState('');
      const [isLoadingCat, setIsLoadingCat] = useState(false);

      // Session Details state (Interviewee, Interviewer, Date, Time)
      const [sessionDetails, setSessionDetails] = useState({
        candidateName: '',
        interviewerName: '',
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5)
      });
      
      const [presets, setPresets] = useState(() => {
        const saved = localStorage.getItem('interviewmate_presets');
        return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
      });

      const [savedSessions, setSavedSessions] = useState(() => {
        const saved = localStorage.getItem('interviewmate_sessions');
        return saved ? JSON.parse(saved) : DEFAULT_SESSIONS;
      });

      const [editingPreset, setEditingPreset] = useState(null);

      const [config, setConfig] = useState({
        department: 'Information Technology',
        position: 'Software Engineer',
        customPosition: '',
        seniority: 'Mid-Level',
        composition: {
          General: 1,
          Technical: 2,
          Behavioral: 2,
          Situational: 0,
          Competency: 0,
          Leadership: 0
        },
        additionalContext: ''
      });

      const [generatedKit, setGeneratedKit] = useState(null);
      const [candidateScores, setCandidateScores] = useState({});
      const [candidateNotes, setCandidateNotes] = useState({});
      const [aiAnswerReviews, setAiAnswerReviews] = useState({});
      const [reviewingIndex, setReviewingIndex] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      const totalQuestionsCount = useMemo(() => {
        return Object.values(config.composition).reduce((a, b) => a + Number(b), 0);
      }, [config.composition]);

      // Cat Easter Egg Fetch Handler
      const handlePretzelClick = async () => {
        setShowCatModal(true);
        setIsLoadingCat(true);
        try {
          const res = await fetch('[https://api.thecatapi.com/v1/images/search](https://api.thecatapi.com/v1/images/search)');
          const data = await res.json();
          if (data && data[0] && data[0].url) {
            setCatImageUrl(data[0].url);
          } else {
            setCatImageUrl(`[https://cataas.com/cat?t=$](https://cataas.com/cat?t=$){Date.now()}`);
          }
        } catch (err) {
          setCatImageUrl(`[https://cataas.com/cat?t=$](https://cataas.com/cat?t=$){Date.now()}`);
        } finally {
          setIsLoadingCat(false);
        }
      };

      // 100-Point Rating Calculation Engine
      const computeOverallStats = useMemo(() => {
        const scores = Object.values(candidateScores).filter(s => typeof s === 'number');
        if (scores.length === 0) return { score100: 0, count: 0, recommendation: outputLang === 'id' ? 'Menunggu Penilaian' : 'Pending Ratings' };
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avgScore5 = sum / scores.length;
        const score100 = Math.round((avgScore5 / 5) * 100);
        
        let recommendation = outputLang === 'id' ? 'Tidak Direkomendasikan' : 'Not Recommended';
        if (score100 >= 90) recommendation = outputLang === 'id' ? 'Sangat Direkomendasikan' : 'Strongly Recommended';
        else if (score100 >= 72) recommendation = outputLang === 'id' ? 'Direkomendasikan' : 'Recommended';
        else if (score100 >= 56) recommendation = outputLang === 'id' ? 'Perlu Evaluasi Lanjutan' : 'Further Evaluation Needed';

        return { score100, count: scores.length, recommendation };
      }, [candidateScores, outputLang]);

      // Dashboard Analytics
      const dashboardStats = useMemo(() => {
        const totalInterviewed = savedSessions.length;
        const totalQuestions = savedSessions.reduce((sum, s) => sum + (s.questionCount || 5), 0);
        const avgScore100 = totalInterviewed > 0 
          ? Math.round(savedSessions.reduce((sum, s) => sum + Number(s.score100 || (s.avgScore * 20)), 0) / totalInterviewed)
          : 0;
        
        const positionsList = Array.from(new Set(savedSessions.map(s => s.position)));
        const competenciesSet = new Set();
        savedSessions.forEach(s => (s.competencies || ['Technical Depth', 'STAR Execution', 'Problem Solving']).forEach(c => competenciesSet.add(c)));

        const valuesSet = new Set();
        savedSessions.forEach(s => (s.companyValues || ['Execution Excellence', 'Integrity', 'Team Alignment']).forEach(v => valuesSet.add(v)));

        return {
          totalInterviewed,
          totalQuestions,
          avgScore100,
          positionsList,
          competencies: Array.from(competenciesSet),
          companyValues: Array.from(valuesSet)
        };
      }, [savedSessions]);

      const handleCompositionChange = (type, val) => {
        const parsedVal = Math.max(0, parseInt(val) || 0);
        const currentOthersTotal = Object.entries(config.composition)
          .filter(([k]) => k !== type)
          .reduce((sum, [_, count]) => sum + Number(count), 0);
        
        const allowedVal = Math.min(parsedVal, 10 - currentOthersTotal);
        setConfig(prev => ({
          ...prev,
          composition: { ...prev.composition, [type]: allowedVal }
        }));
      };

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('interviewmate_gemini_key', key);
        setApiErrorMessage('');
      };

      const handleScoreChange = (qIndex, score) => {
        setCandidateScores(prev => ({ ...prev, [qIndex]: score }));
      };

      const handleNoteChange = (qIndex, note) => {
        setCandidateNotes(prev => ({ ...prev, [qIndex]: note }));
      };

      const handleUpdateQuestion = (qIndex, field, value) => {
        if (!generatedKit) return;
        const updatedQuestions = [...generatedKit.questions];
        updatedQuestions[qIndex] = { ...updatedQuestions[qIndex], [field]: value };
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleAddCustomQuestion = () => {
        if (!generatedKit) return;
        if (generatedKit.questions.length >= 10) {
          alert('Maximum limit of 10 questions reached per kit.');
          return;
        }
        const newQ = {
          id: `q-custom-${Date.now()}`,
          category: 'Custom',
          question: outputLang === 'id' ? 'Pertanyaan kustom baru...' : 'New custom question...',
          purpose: outputLang === 'id' ? 'Menilai kriteria khusus.' : 'Evaluates specific custom role criteria.',
          greenFlags: [outputLang === 'id' ? 'Penjelasan terstruktur' : 'Structured explanation'],
          redFlags: [outputLang === 'id' ? 'Penjelasan kabur' : 'Vague answer'],
          rubricMatrix: {
            1: outputLang === 'id' ? 'Tidak memenuhi' : 'Does not meet expectations',
            3: outputLang === 'id' ? 'Memenuhi standar' : 'Meets expectations',
            5: outputLang === 'id' ? 'Luar biasa' : 'Exceptional'
          }
        };
        setGeneratedKit({ ...generatedKit, questions: [...generatedKit.questions, newQ] });
      };

      const handleDeleteQuestion = (qIndex) => {
        if (!generatedKit) return;
        const updatedQuestions = generatedKit.questions.filter((_, i) => i !== qIndex);
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleRegenerateSingleQuestion = async (qIndex) => {
        if (!generatedKit) return;
        const qToReplace = generatedKit.questions[qIndex];
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';

        const prompt = `Generate 1 alternative ${qToReplace.category} interview question in ${targetLangStr} for a ${generatedKit.seniority} level ${generatedKit.position}. Ensure it is completely distinct.
Return ONLY raw JSON matching:
{
  "category": "${qToReplace.category}",
  "question": "Question text",
  "purpose": "Purpose",
  "greenFlags": ["Flag 1", "Flag 2"],
  "redFlags": ["Flag 1", "Flag 2"],
  "rubricMatrix": {"1": "Poor description", "3": "Meets expectations description", "5": "Excellent description"}
}`;

        if (apiKey && apiKey.trim()) {
          try {
            const parsed = await callAIProvider(prompt, apiKey, "You are an expert HR interviewer. Output ONLY valid JSON.");
            const updatedQuestions = [...generatedKit.questions];
            updatedQuestions[qIndex] = { ...parsed, id: `q-regen-${Date.now()}` };
            setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
            return;
          } catch(err) {
            console.warn("Single question AI swap failed:", err);
            alert(`AI Swap Error: ${err.message}`);
          }
        }

        const updatedQuestions = [...generatedKit.questions];
        updatedQuestions[qIndex] = {
          ...qToReplace,
          question: outputLang === 'id' 
            ? `[Alternatif] Bagaimana Anda mengelola prioritas utama dalam peran ${generatedKit.position}?`
            : `[Alternative] How do you manage critical priorities in your role as ${generatedKit.position}?`,
          id: `q-regen-${Date.now()}`
        };
        setGeneratedKit({ ...generatedKit, questions: updatedQuestions });
      };

      const handleReviewAnswerWithAI = async (qIndex) => {
        const note = candidateNotes[qIndex];
        if (!note || !note.trim()) {
          alert('Please record transcript notes for this response before triggering AI review.');
          return;
        }
        setReviewingIndex(qIndex);

        const questionObj = generatedKit.questions[qIndex];
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';

        const prompt = `You are an executive interviewer evaluating under Scrutiny Level: ${scrutinyMode}.
Question: "${questionObj.question}"
Candidate Transcript Notes: "${note}"
Rubrics: Score 1: ${questionObj.rubricMatrix?.[1] || 'Poor'}, Score 3: ${questionObj.rubricMatrix?.[3] || 'Meets'}, Score 5: ${questionObj.rubricMatrix?.[5] || 'Exceptional'}

Analyze in ${targetLangStr}. Return ONLY raw JSON:
{
  "suggestedScore": 3,
  "strengthsFound": ["Strength 1", "Strength 2"],
  "gapsFound": ["Gap 1"],
  "suggestedFollowUp": "Follow-up question"
}`;

        if (apiKey && apiKey.trim()) {
          try {
            const parsed = await callAIProvider(prompt, apiKey, "You are an executive interviewer. Output ONLY valid JSON.");
            setAiAnswerReviews(prev => ({ ...prev, [qIndex]: parsed }));
            if (parsed.suggestedScore) handleScoreChange(qIndex, parsed.suggestedScore);
            setReviewingIndex(null);
            return;
          } catch (err) {
            console.warn("AI Answer Review failed:", err);
            alert(`AI Answer Review Error: ${err.message}`);
            setReviewingIndex(null);
            return;
          }
        }

        setTimeout(() => {
          const mockResult = {
            suggestedScore: Math.min(5, Math.max(2, Math.floor(note.length / 25))),
            strengthsFound: outputLang === 'id' ? ['Menyebutkan konteks terstruktur', 'Menjelaskan alur tindakan'] : ['Mentions structured context', 'Explains action methodology'],
            gapsFound: outputLang === 'id' ? ['Dapat menambahkan metrik hasil bisnis terukur'] : ['Could include more specific quantified business impact'],
            suggestedFollowUp: outputLang === 'id' ? 'Apa metrik utama yang Anda gunakan untuk mengukur keberhasilan tersebut?' : 'What key metric did you use to measure that success?'
          };
          setAiAnswerReviews(prev => ({ ...prev, [qIndex]: mockResult }));
          handleScoreChange(qIndex, mockResult.suggestedScore);
          setReviewingIndex(null);
        }, 800);
      };

      const handleCopyCheatsheet = () => {
        if (!generatedKit) return;
        let text = `INTERVIEW QUESTION CHEATSHEET\nPosition: ${generatedKit.position} (${generatedKit.seniority})\nInterviewee: ${sessionDetails.candidateName || 'N/A'}\nInterviewer: ${sessionDetails.interviewerName || 'N/A'}\nDate & Time: ${sessionDetails.date} @ ${sessionDetails.time}\nLanguage: ${outputLang === 'id' ? 'Bahasa Indonesia' : 'English'}\n\n`;

        generatedKit.questions.forEach((q, idx) => {
          text += `Q${idx + 1} [${q.category}]: ${q.question}\n`;
          
          if (cheatsheetDetail !== 'only_questions') {
            text += `Purpose: ${q.purpose}\n`;
            text += `Recommended Rubric Matrix:\n`;
            text += `  [1 - Poor]: ${q.rubricMatrix?.[1] || 'Does not meet standards'}\n`;
            text += `  [3 - Meets]: ${q.rubricMatrix?.[3] || 'Meets expectations'}\n`;
            text += `  [5 - Excellent]: ${q.rubricMatrix?.[5] || 'Exceptional mastery'}\n`;
          }

          if (cheatsheetDetail === 'full') {
            text += `Green Flags: ${q.greenFlags ? q.greenFlags.join('; ') : 'N/A'}\n`;
            text += `Red Flags: ${q.redFlags ? q.redFlags.join('; ') : 'N/A'}\n`;
          }
          text += `--------------------------------------------------\n\n`;
        });

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => {
            setCopyStatus(outputLang === 'id' ? 'Tersalin!' : 'Copied!');
            setTimeout(() => setCopyStatus(''), 3000);
          });
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          setCopyStatus(outputLang === 'id' ? 'Tersalin!' : 'Copied!');
          setTimeout(() => setCopyStatus(''), 3000);

          questionCount: generatedKit.questions.length,

          companyValues: ['Execution Excellence', 'Integrity', 'Team Alignment']

        setSavedSessions(updated);
        localStorage.setItem('interviewmate_sessions', JSON.stringify(updated));
        alert('Candidate evaluation session saved to dashboard analytics!');

      const generateInterviewQuestions = async () => {
        setIsGenerating(true);

        setAiAnswerReviews({});

        const targetPosition = (config.department === 'Other / Custom' || config.position === 'Custom Position')

        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';
        
        const compositionText = Object.entries(config.composition)

          .map(([type, count]) => `${count} ${type} Questions`)

        const prompt = `Generate a structured interview question kit strictly in ${targetLangStr} for a ${config.seniority} level ${targetPosition} in ${config.department}.
Composition requirement: ${compositionText} (Total ${totalQuestionsCount} questions, max 10).
Additional Context: ${config.additionalContext || 'None'}

CRITICAL INSTRUCTIONS:
- EVERY QUESTION MUST BE DISTINCT, HIGHLY ROLE-SPECIFIC, AND NON-REPETITIVE.
- Provide a clear 3-tier Recommended Rubric matrix for each question:
  - "1": Specific description for Score 1 (Poor/Unsatisfactory)
  - "3": Specific description for Score 3 (Meets Expectations/Baseline)
  - "5": Specific description for Score 5 (Exceptional/Exceeds)

Return ONLY a raw JSON object with zero markdown wrapper:
{
  "questions": [
    {
      "id": "q1",
      "category": "Technical",
      "question": "Unique role-tailored question in ${targetLangStr}",
      "purpose": "Target competency evaluated in ${targetLangStr}",
      "greenFlags": ["Strong positive indicator 1", "Strong positive indicator 2"],
      "redFlags": ["Red flag warning 1", "Red flag warning 2"],
      "rubricMatrix": {
        "1": "Description for Poor (Score 1)",
        "3": "Description for Meets Expectations (Score 3)",
        "5": "Description for Exceptional (Score 5)"
      }
    }
  ]
}`;

        if (apiKey && apiKey.trim()) {

            const parsed = await callAIProvider(prompt, apiKey, "You are an expert HR interviewer. Output ONLY valid JSON.");

                question: `${qText} (Role: ${config.seniority} ${targetPosition})`,

                redFlags: outputLang === 'id'

                rubricMatrix: {

                  3: outputLang === 'id' ? 'Memenuhi standar dasar dengan metodologi jelas.' : 'Meets baseline standards with clear methodology.',
                  5: outputLang === 'id' ? 'Luar biasa dengan penjelasan dampak bisnis terukur.' : 'Exceptional answer with clear ROI and impact.'

                </select>
                <input type="text" value={editingPreset.position} onChange={e => setEditingPreset({ ...editingPreset, position: e.target.value })} placeholder="Position..." className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setEditingPreset(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => {
                    const updated = presets.filter(p => p.id !== editingPreset.id);
                    const newPresets = [...updated, editingPreset];
                    setPresets(newPresets);
                    localStorage.setItem('interviewmate_presets', JSON.stringify(newPresets));
                    setEditingPreset(null);
                  }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Preset</button>
                </div>
              </div>
            </div>
          )}

          {/* Multi-Provider API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Configure AI API Key</h3>
                <p className="text-xs text-slate-500">Get free keys from <strong>Google AI Studio</strong> (aistudio.google.com), <strong>Groq</strong> (console.groq.com), or <strong>OpenRouter</strong> (openrouter.ai).</p>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="API Key (e.g., AIzaSy... or gsk_...)" className="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono bg-slate-50" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => { handleSaveApiKey(apiKey); setShowApiKeyModal(false); }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Key</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
