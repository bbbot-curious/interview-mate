      @keyframes pretzelWiggle {
        0%, 100% { transform: rotate(0deg) scale(1); }
        20% { transform: rotate(-12deg) scale(1.2); }
        40% { transform: rotate(12deg) scale(1.2); }
        60% { transform: rotate(-8deg) scale(1.1); }
        80% { transform: rotate(8deg) scale(1.1); }
      }
      .pretzel-anim {
        display: inline-block;
        animation: pretzelWiggle 3s infinite ease-in-out;
        transform-origin: center;
      }
      @media print {
        header, nav, button, footer, .no-print, .pretzel-anim { display: none !important; }

        .print-card { border: 1px solid #cbd5e1 !important; box-shadow: none !important; break-inside: avoid; }

    // ------------------------------------------------------------------
    // Utility helpers
    // ------------------------------------------------------------------
    const uid = (prefix = 'q') =>
      `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

    function safeParse(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (err) {
        console.warn(`safeParse: failed to parse "${key}"`, err);
        return fallback;
      }
    }

    function fetchWithTimeout(url, options = {}, timeoutMs = 30000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal })
        .finally(() => clearTimeout(timer));
    }

    function extractJSON(text) {
      if (typeof text !== 'string' || !text.trim()) {
        throw new Error('AI provider returned an empty response.');
      }
      let cleaned = text.trim();
      cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
      try {
        return JSON.parse(cleaned);
      } catch (_) {
        const start = cleaned.indexOf('{');
        const end = cleaned.lastIndexOf('}');
        if (start === -1 || end <= start) {
          throw new Error('No JSON object found in AI response.');
        }
        return JSON.parse(cleaned.slice(start, end + 1));
      }
    }

    // ------------------------------------------------------------------
    // Provider detection + multi-provider client
    // ------------------------------------------------------------------
    function detectProvider(key) {
      const k = (key || '').trim();
      if (!k) return 'unknown';
      if (k.startsWith('gsk_')) return 'groq';
      if (k.startsWith('sk-or-')) return 'openrouter';
      if (k.startsWith('sk-ant-')) return 'anthropic';
      if (k.startsWith('sk-')) return 'openai';
      if (k.startsWith('AIza')) return 'gemini';
      return 'custom';
    }

    const PROVIDER_PRESETS = {
      groq:       { label: 'Groq',                       url: 'https://api.groq.com/openai/v1',  model: 'llama-3.3-70b-versatile' },
      openrouter: { label: 'OpenRouter',                 url: 'https://openrouter.ai/api/v1',    model: 'meta-llama/llama-3.3-70b-instruct:free' },
      openai:     { label: 'OpenAI',                     url: 'https://api.openai.com/v1',       model: 'gpt-4o-mini' },
      anthropic:  { label: 'Anthropic (Claude)',         url: 'https://api.anthropic.com/v1',    model: 'claude-3-5-haiku-20241022' },
      gemini:     { label: 'Google Gemini',              url: null,                              model: 'gemini-2.0-flash' },
      custom:     { label: 'Custom OpenAI-compatible',   url: '',                                model: 'gpt-4o-mini' }
    };

    async function callAIProvider(
      prompt,
      apiKey,
      systemInstruction = "You are an expert HR interviewer.",
      providerOverride = 'auto',
      customBaseUrl = '',
      customModel = ''
    ) {
      const key = (apiKey || '').trim();
      if (!key) throw new Error("No API key provided. Click 'Set API Key' in the top right.");

      const system = `${systemInstruction} Respond with exactly one valid JSON object — no markdown fences, no prose, no explanation.`;
      const provider = providerOverride && providerOverride !== 'auto' ? providerOverride : detectProvider(key);

      if (provider === 'unknown') throw new Error("API key is empty.");

      // ---------- OpenAI-compatible providers ----------
      if (provider === 'groq' || provider === 'openrouter' || provider === 'openai' || provider === 'custom') {
        const preset = PROVIDER_PRESETS[provider];
        const baseUrl = (provider === 'custom' ? customBaseUrl : preset.url)?.trim().replace(/\/+$/, '');
        const model   = (provider === 'custom' ? customModel : preset.model)?.trim() || preset.model;

        if (!baseUrl) throw new Error("Custom endpoint requires a Base URL (e.g. https://api.yourprovider.com/v1).");
        if (!model)   throw new Error("Custom endpoint requires a Model name (e.g. glm-4-flash, deepseek-chat, mistral-small-latest).");

        const res = await fetchWithTimeout(`${baseUrl}/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
          body: JSON.stringify({
            model,
            messages: [
              { role: "system", content: system },
              { role: "user", content: prompt }
            ],
            response_format: { type: "json_object" }
          })
        });

        if (!res.ok) {
          const errBody = await res.text().catch(() => '');
          let msg = res.statusText;
          try { msg = JSON.parse(errBody).error?.message || msg; } catch (_) { /* plain text */ }
          throw new Error(`${preset.label} API error (${res.status}): ${msg || errBody.slice(0, 200)}`);
        }
        const data = await res.json();
        const text = data.choices?.[0]?.message?.content;
        return extractJSON(text);
      }

      // ---------- Anthropic ----------
      if (provider === 'anthropic') {
        const model = customModel?.trim() || PROVIDER_PRESETS.anthropic.model;
        const res = await fetchWithTimeout("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": key,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model,
            max_tokens: 4096,
            system,
            messages: [{ role: "user", content: prompt }]
          })
        });
        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(`Anthropic API error (${res.status}): ${errData.error?.message || res.statusText}`);
        }
        const data = await res.json();
        const text = data.content?.find(b => b.type === 'text')?.text;
        return extractJSON(text);
      }

      // ---------- Gemini ----------
      if (provider === 'gemini') {
        const modelsToTry = [customModel?.trim(), "gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-flash-8b"].filter(Boolean);
        let lastError = null;
        for (const model of modelsToTry) {
          try {
            const res = await fetchWithTimeout(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: `${system}\n\n${prompt}` }] }],
                  generationConfig: { responseMimeType: "application/json" }
                })
              }
            );
            if (!res.ok) {
              const e = await res.json().catch(() => ({}));
              throw new Error(`Gemini ${model} error (${res.status}): ${e.error?.message || res.statusText}`);
            }
            const data = await res.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (text) return extractJSON(text);
          } catch (err) {
            lastError = err;
          }
        }
        throw lastError || new Error("Failed to receive a response from Google Gemini API.");
      }

      throw new Error(`Unsupported provider: ${provider}.`);
    }

    // ------------------------------------------------------------------
    // Main App
    // ------------------------------------------------------------------
    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [outputLang, setOutputLang] = useState('en');
      const [studioViewMode, setStudioViewMode] = useState('studio');
      const [cheatsheetDetail, setCheatsheetDetail] = useState('full');

      const [apiKey, setApiKey] = useState(() => {
        const current = localStorage.getItem('interviewmate_api_key');
        if (current !== null) return current;
        return localStorage.getItem('interviewmate_gemini_key') || '';
      });
      const [apiProvider, setApiProvider] = useState(() => localStorage.getItem('interviewmate_api_provider') || 'auto');
      const [apiBaseUrl, setApiBaseUrl] = useState(() => localStorage.getItem('interviewmate_api_baseurl') || '');
      const [apiModel, setApiModel] = useState(() => localStorage.getItem('interviewmate_api_model') || '');

      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [scrutinyMode, setScrutinyMode] = useState('balanced');
      const [copyStatus, setCopyStatus] = useState('');
      const [apiStatusMessage, setApiStatusMessage] = useState('');
      const [apiErrorMessage, setApiErrorMessage] = useState('');
      const [compositionWarning, setCompositionWarning] = useState('');

      const [showCatModal, setShowCatModal] = useState(false);
      const [catImageUrl, setCatImageUrl] = useState('');
      const [isLoadingCat, setIsLoadingCat] = useState(false);

      const [sessionDetails, setSessionDetails] = useState({
        candidateName: '',
        interviewerName: '',
        date: new Date().toISOString().split('T')[0],
        time: new Date().toTimeString().slice(0, 5)
      });

      const [presets, setPresets] = useState(() => safeParse('interviewmate_presets', DEFAULT_PRESETS));
      const [savedSessions, setSavedSessions] = useState(() => safeParse('interviewmate_sessions', DEFAULT_SESSIONS));
      const [editingPreset, setEditingPreset] = useState(null);

      const [config, setConfig] = useState({
        department: 'Information Technology',
        position: 'Software Engineer',
        customPosition: '',
        seniority: 'Mid-Level',
        composition: {
          General: 1,
          Technical: 2,
          Behavioral: 2,
          Situational: 0,
          Competency: 0,
          Leadership: 0
        },
        additionalContext: ''
      });

      const [generatedKit, setGeneratedKit] = useState(null);
      const [candidateScores, setCandidateScores] = useState({});
      const [candidateNotes, setCandidateNotes] = useState({});
      const [aiAnswerReviews, setAiAnswerReviews] = useState({});
      const [reviewingId, setReviewingId] = useState(null);
      const [swappingId, setSwappingId] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);
      const [sessionSaved, setSessionSaved] = useState(false);

      const totalQuestionsCount = useMemo(() => {
        return Object.values(config.composition).reduce((a, b) => a + Number(b), 0);
      }, [config.composition]);

      const handlePretzelClick = async () => {
        setShowCatModal(true);
        setIsLoadingCat(true);
        try {
          const res = await fetchWithTimeout('https://api.thecatapi.com/v1/images/search', {}, 8000);
          const data = await res.json();
          if (data && data[0] && data[0].url) {
            setCatImageUrl(data[0].url);
          } else {
            setCatImageUrl(`https://cataas.com/cat?t=${Date.now()}`);
          }
        } catch (err) {
          setCatImageUrl(`https://cataas.com/cat?t=${Date.now()}`);
        } finally {
          setIsLoadingCat(false);
        }
      };

      const computeOverallStats = useMemo(() => {
        const scores = Object.values(candidateScores).filter(s => typeof s === 'number');
        if (scores.length === 0) {
          return {
            score100: 0,
            count: 0,
            recommendation: outputLang === 'id' ? 'Menunggu Penilaian' : 'Pending Ratings'
          };
        }
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avgScore5 = sum / scores.length;
        const score100 = Math.round((avgScore5 / 5) * 100);

        let recommendation = outputLang === 'id' ? 'Tidak Direkomendasikan' : 'Not Recommended';
        if (score100 >= 90) recommendation = outputLang === 'id' ? 'Sangat Direkomendasikan' : 'Strongly Recommended';
        else if (score100 >= 72) recommendation = outputLang === 'id' ? 'Direkomendasikan' : 'Recommended';
        else if (score100 >= 56) recommendation = outputLang === 'id' ? 'Perlu Evaluasi Lanjutan' : 'Further Evaluation Needed';

        return { score100, count: scores.length, recommendation };
      }, [candidateScores, outputLang]);

      const dashboardStats = useMemo(() => {
        const totalInterviewed = savedSessions.length;
        const totalQuestions = savedSessions.reduce((sum, s) => sum + (s.questionCount || 5), 0);
        const avgScore100 = totalInterviewed > 0
          ? Math.round(savedSessions.reduce((sum, s) => sum + Number(s.score100 ?? 0), 0) / totalInterviewed)
          : 0;

        const positionsList = Array.from(new Set(savedSessions.map(s => s.position)));
        const competenciesSet = new Set();
        savedSessions.forEach(s => (s.competencies || ['Technical Depth', 'STAR Execution', 'Problem Solving']).forEach(c => competenciesSet.add(c)));
        const valuesSet = new Set();
        savedSessions.forEach(s => (s.companyValues || ['Execution Excellence', 'Integrity', 'Team Alignment']).forEach(v => valuesSet.add(v)));

        return {
          totalInterviewed,
          totalQuestions,
          avgScore100,
          positionsList,
          competencies: Array.from(competenciesSet),
          companyValues: Array.from(valuesSet)
        };
      }, [savedSessions]);

      const handleCompositionChange = (type, val) => {
        const parsedVal = Math.max(0, parseInt(val) || 0);
        const currentOthersTotal = Object.entries(config.composition)
          .filter(([k]) => k !== type)
          .reduce((sum, [_, count]) => sum + Number(count), 0);

        const allowedVal = Math.max(0, Math.min(parsedVal, 10 - currentOthersTotal));
        setCompositionWarning('');
        if (parsedVal > allowedVal) {
          setCompositionWarning(`Total questions capped at 10. "${type}" reduced to ${allowedVal}.`);
          setTimeout(() => setCompositionWarning(''), 3500);
        }
        setConfig(prev => ({
          ...prev,
          composition: { ...prev.composition, [type]: allowedVal }
        }));
      };

      const handleSaveApiKey = (key, provider, baseUrl, model) => {
        const trimmed = (key || '').trim();
        setApiKey(trimmed);
        setApiProvider(provider || 'auto');
        setApiBaseUrl(baseUrl || '');
        setApiModel(model || '');
        try {
          localStorage.setItem('interviewmate_api_key', trimmed);
          localStorage.setItem('interviewmate_api_provider', provider || 'auto');
          localStorage.setItem('interviewmate_api_baseurl', baseUrl || '');
          localStorage.setItem('interviewmate_api_model', model || '');
          localStorage.removeItem('interviewmate_gemini_key');
        } catch (e) {
          console.warn('Could not persist API key', e);
        }
        setApiErrorMessage('');
      };

      const handleClearApiKey = () => {
        setApiKey('');
        setApiProvider('auto');
        setApiBaseUrl('');
        setApiModel('');
        try {
          localStorage.removeItem('interviewmate_api_key');
          localStorage.removeItem('interviewmate_api_provider');
          localStorage.removeItem('interviewmate_api_baseurl');
          localStorage.removeItem('interviewmate_api_model');
          localStorage.removeItem('interviewmate_gemini_key');
        } catch (e) { /* noop */ }
        setApiStatusMessage('');
        setApiErrorMessage('');
      };

      const handleScoreChange = (qId, score) => {
        setCandidateScores(prev => ({ ...prev, [qId]: score }));
        setSessionSaved(false);
      };

      const handleNoteChange = (qId, note) => {
        setCandidateNotes(prev => ({ ...prev, [qId]: note }));
        setSessionSaved(false);
      };

      const handleUpdateQuestion = (qId, field, value) => {
        setGeneratedKit(prev => {
          if (!prev) return prev;
          return {
            ...prev,
            questions: prev.questions.map(q => q.id === qId ? { ...q, [field]: value } : q)
          };
        });
      };

      const handleAddCustomQuestion = () => {
        if (!generatedKit) return;
        if (generatedKit.questions.length >= 10) {
          alert('Maximum limit of 10 questions reached per kit.');
          return;
        }
        const newQ = {
          id: uid('q-custom'),
          category: 'Custom',
          question: outputLang === 'id' ? 'Pertanyaan kustom baru...' : 'New custom question...',
          purpose: outputLang === 'id' ? 'Menilai kriteria khusus.' : 'Evaluates specific custom role criteria.',
          greenFlags: [outputLang === 'id' ? 'Penjelasan terstruktur' : 'Structured explanation'],
          redFlags: [outputLang === 'id' ? 'Penjelasan kabur' : 'Vague answer'],
          rubricMatrix: {
            1: outputLang === 'id' ? 'Tidak memenuhi' : 'Does not meet expectations',
            3: outputLang === 'id' ? 'Memenuhi standar' : 'Meets expectations',
            5: outputLang === 'id' ? 'Luar biasa' : 'Exceptional'
          }
        };
        setGeneratedKit(prev => ({ ...prev, questions: [...prev.questions, newQ] }));
      };

      const handleDeleteQuestion = (qId) => {
        setGeneratedKit(prev => {
          if (!prev) return prev;
          return { ...prev, questions: prev.questions.filter(q => q.id !== qId) };
        });
        setCandidateScores(prev => { const n = { ...prev }; delete n[qId]; return n; });
        setCandidateNotes(prev => { const n = { ...prev }; delete n[qId]; return n; });
        setAiAnswerReviews(prev => { const n = { ...prev }; delete n[qId]; return n; });
        setSessionSaved(false);
      };

      const handleRegenerateSingleQuestion = async (qId) => {

Return ONLY raw JSON matching:
{
  "category": "${qToReplace.category}",
  "question": "Question text",
  "purpose": "Purpose",
  "greenFlags": ["Flag 1", "Flag 2"],
  "redFlags": ["Flag 1", "Flag 2"],
  "rubricMatrix": {"1": "Poor description", "3": "Meets expectations description", "5": "Excellent description"}
}`;

        try {
          if (apiKey && apiKey.trim()) {
            const parsed = await callAIProvider(prompt, apiKey, "You are an expert HR interviewer.", apiProvider, apiBaseUrl, apiModel);
            const normalised = {
              id: uid('q-regen'),
              category: parsed.category || qToReplace.category,
              question: parsed.question || qToReplace.question,
              purpose: parsed.purpose || qToReplace.purpose || '',
              greenFlags: Array.isArray(parsed.greenFlags) ? parsed.greenFlags : qToReplace.greenFlags,

            setGeneratedKit(prev => {
              if (!prev) return prev;
              return { ...prev, questions: prev.questions.map(q => q.id === qId ? normalised : q) };
            });
            setCandidateScores(prev => {
              if (prev[qId] === undefined) return prev;
              const n = { ...prev, [normalised.id]: prev[qId] };
              delete n[qId];
              return n;
            });
            setCandidateNotes(prev => {
              if (prev[qId] === undefined) return prev;
              const n = { ...prev, [normalised.id]: prev[qId] };
              delete n[qId];
              return n;
            });
            setAiAnswerReviews(prev => {
              if (prev[qId] === undefined) return prev;
              const n = { ...prev, [normalised.id]: prev[qId] };
              delete n[qId];
              return n;
            });
            return;

          const offlineText = outputLang === 'id'
            ? `[Alternatif] Bagaimana Anda mengelola prioritas utama dalam peran ${generatedKit.position}?`

            return {
              ...prev,
              questions: prev.questions.map(q => q.id === qId ? { ...q, id: newId, question: offlineText } : q)
            };

          setCandidateScores(prev => { const n = { ...prev }; delete n[qId]; return n; });
          setCandidateNotes(prev => { const n = { ...prev }; delete n[qId]; return n; });
          setAiAnswerReviews(prev => { const n = { ...prev }; delete n[qId]; return n; });

      const handleReviewAnswerWithAI = async (qId) => {

        const questionObj = generatedKit.questions.find(q => q.id === qId);

        setReviewingId(qId);
        const targetLangStr = outputLang === 'id' ? 'Bahasa Indonesia' : 'English';

        const prompt = `You are an executive interviewer evaluating under Scrutiny Level: ${scrutinyMode}.
Question: "${questionObj.question}"
Candidate Transcript Notes: "${note}"
Rubrics: Score 1: ${questionObj.rubricMatrix?.[1] || 'Poor'}, Score 3: ${questionObj.rubricMatrix?.[3] || 'Meets'}, Score 5: ${questionObj.rubricMatrix?.[5] || 'Exceptional'}

Analyze in ${targetLangStr}. Return ONLY raw JSON:
{
  "suggestedScore": 3,
  "strengthsFound": ["Strength 1", "Strength 2"],
  "gapsFound": ["Gap 1"],
  "suggestedFollowUp": "Follow-up question"
}`;

        const normalise = (parsed) => ({
          suggestedScore: Math.min(5, Math.max(1, Number(parsed.suggestedScore) || 3)),
          strengthsFound: Array.isArray(parsed.strengthsFound) ? parsed.strengthsFound : [],
          gapsFound: Array.isArray(parsed.gapsFound) ? parsed.gapsFound : [],

        });

        try {
          if (apiKey && apiKey.trim()) {
            const parsed = await callAIProvider(prompt, apiKey, "You are an executive interviewer.", apiProvider, apiBaseUrl, apiModel);

            setAiAnswerReviews(prev => ({ ...prev, [qId]: cleaned }));
            handleScoreChange(qId, cleaned.suggestedScore);

          }

          await new Promise(resolve => setTimeout(resolve, 800));
          const mockResult = normalise({
            suggestedScore: Math.min(5, Math.max(2, Math.floor(note.length / 25))),
            strengthsFound: outputLang === 'id' ? ['Menyebutkan konteks terstruktur', 'Menjelaskan alur tindakan'] : ['Mentions structured context', 'Explains action methodology'],

          });
          setAiAnswerReviews(prev => ({ ...prev, [qId]: mockResult }));
          handleScoreChange(qId, mockResult.suggestedScore);
        } catch (err) {
          console.warn("AI Answer Review failed:", err);
          setApiErrorMessage(`AI Answer Review Error: ${err.message}`);

          setReviewingId(null);

            text += `  [3 - Meets]: ${q.rubricMatrix?.[3] || 'Meets expectations'}\n`;
            text += `  [5 - Excellent]: ${q.rubricMatrix?.[5] || 'Exceptional mastery'}\n`;

          text += `--------------------------------------------------\n\n`;

        const markCopied = () => {
          setCopyStatus(outputLang === 'id' ? 'Tersalin!' : 'Copied!');
          setTimeout(() => setCopyStatus(''), 3000);
        };

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(markCopied).catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try { document.execCommand('copy'); } catch (_) { /* noop */ }
            document.body.removeChild(textArea);
            markCopied();
          });
        } else {
          const textArea = document.createElement('textarea');
          textArea.value = text;
          document.body.appendChild(textArea);
          textArea.select();
          try { document.execCommand('copy'); } catch (_) { /* noop */ }
          document.body.removeChild(textArea);
          markCopied();

                        <thead className="bg-rose-50 text-rose-900 font-bold border-b border-rose-200">
                          <tr>
                            <th className="p-3 w-1/4">Keyword</th>
                            <th className="p-3 w-1/2">Observed Evidence / Response</th>
                            <th className="p-3 w-1/4">Impact / Recommendation</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-rose-100 bg-white">
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#QuantifiedMetrics</td>
                            <td className="p-3 text-slate-600">Could provide more hard business impact data in examples.</td>
                            <td className="p-3 text-slate-500">Coach on ROI metrics</td>
                          </tr>
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#EdgeCaseHandling</td>
                            <td className="p-3 text-slate-600">Deeper elaboration needed for risk mitigation strategies.</td>
                            <td className="p-3 text-slate-500">Pair with senior mentor</td>
                          </tr>
                          <tr>
                            <td className="p-3 font-bold text-rose-700">#DelegationDepth</td>
                            <td className="p-3 text-slate-600">Tends to focus heavily on individual effort rather than team scale.</td>
                            <td className="p-3 text-slate-500">Leadership development</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'about' && (
                <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-4xl mx-auto space-y-8">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">About & Free API Guide</h2>
                    <p className="text-xs text-slate-500 mt-1">AI-powered interview question generator & candidate evaluation platform.</p>
                  </div>

                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-4">
                    <h3 className="font-bold text-slate-900 text-sm">🔑 Options for Free AI API Keys</h3>
                    <div className="space-y-4 text-xs text-slate-600 leading-relaxed">
                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">1. Google AI Studio (Recommended — Free Tier)</strong>
                        <p>Google provides a free tier for Gemini Flash models with up to 15 requests/minute. Keys start with <code className="bg-slate-100 px-1 rounded">AIza</code>.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Go to <a href="https://aistudio.google.com/" target="_blank" rel="noreferrer" className="text-indigo-600 underline font-semibold">aistudio.google.com</a></li>
                          <li>Sign in with your Google account and click <strong>"Create API Key"</strong>.</li>
                          <li>Paste the key into InterviewMate's API Key modal.</li>
                        </ul>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">2. Groq Cloud (Free Developer Tier)</strong>
                        <p>Groq provides free ultra-fast access to open models. Keys start with <code className="bg-slate-100 px-1 rounded">gsk_</code>.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Visit <a href="https://console.groq.com/" target="_blank" rel="noreferrer" className="text-indigo-600 underline font-semibold">console.groq.com</a></li>
                          <li>Sign up and navigate to <strong>API Keys</strong>.</li>
                        </ul>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">3. OpenRouter (Free & Open Weights Gateway)</strong>
                        <p>OpenRouter offers free-tier open models. Keys start with <code className="bg-slate-100 px-1 rounded">sk-or-</code>.</p>
                        <ul className="list-disc list-inside mt-2 space-y-1 text-slate-500">
                          <li>Visit <a href="https://openrouter.ai/" target="_blank" rel="noreferrer" className="text-indigo-600 underline font-semibold">openrouter.ai</a></li>
                          <li>Create a key under Account Keys.</li>
                        </ul>
                      </div>

                      <div className="bg-white p-4 rounded-xl border border-slate-200">
                        <strong className="text-indigo-600 block text-sm mb-1">4. Any other provider (Zhipu, DeepSeek, Mistral, Together, etc.)</strong>
                        <p>If your key doesn't start with <code>gsk_</code>, <code>sk-or-</code>, <code>sk-</code>, or <code>AIza</code>, choose <strong>"Custom OpenAI-compatible"</strong> in the API modal and fill in the Base URL + Model name.</p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          <footer className="bg-slate-900 text-slate-400 border-t border-slate-800 py-6 px-6 text-center text-xs no-print">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
              <p className="font-medium">InterviewMate — AI Question Generator & Candidate Evaluation Platform</p>
              <p className="text-slate-300 font-bold text-sm">
                Semangat ya ❤️ <span className="pretzel-anim cursor-pointer" title="Click for a cute cat!" onClick={handlePretzelClick}>🥨</span>
              </p>
            </div>
          </footer>

          {showCatModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-sm w-full p-6 rounded-3xl shadow-2xl text-center space-y-4 relative">
                <h3 className="text-lg font-black text-slate-900 flex items-center justify-center space-x-2">
                  <span>Pretzel Cat Power-Up!</span> <span>🥨🐱</span>
                </h3>

                {isLoadingCat ? (
                  <div className="h-64 flex items-center justify-center text-indigo-600 font-bold text-sm">
                    Fetching cat boost...
                  </div>
                ) : (
                  <img
                    src={catImageUrl}
                    alt="Cute Cat Easter Egg"
                    className="w-full h-64 object-cover rounded-2xl shadow-md border border-slate-200"
                  />
                )}

                <p className="text-xs text-slate-500 italic">"May your interviews be smooth and stress-free!"</p>

                <button
                  onClick={() => setShowCatModal(false)}
                  className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow transition"
                >
                  Back to Interviewing ✨
                </button>
              </div>
            </div>
          )}

          {editingPreset && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Edit Preset Template</h3>
                <input type="text" value={editingPreset.title} onChange={e => setEditingPreset({ ...editingPreset, title: e.target.value })} placeholder="Preset Title..." className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
                <select value={editingPreset.department} onChange={e => setEditingPreset({ ...editingPreset, department: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl text-sm">
                  {Object.keys(DEPARTMENT_POSITIONS).map(d => <option key={d} value={d}>{d}</option>)}
                </select>
                <input type="text" value={editingPreset.position} onChange={e => setEditingPreset({ ...editingPreset, position: e.target.value })} placeholder="Position..." className="w-full p-3 border border-slate-300 rounded-xl text-sm" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setEditingPreset(null)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => {
                    const updated = presets.filter(p => p.id !== editingPreset.id);
                    const newPresets = [...updated, editingPreset];
                    setPresets(newPresets);
                    try { localStorage.setItem('interviewmate_presets', JSON.stringify(newPresets)); } catch (e) { console.warn(e); }
                    setEditingPreset(null);
                  }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Preset</button>
                </div>
              </div>
            </div>
          )}

          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-lg w-full p-6 rounded-3xl shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">

                <div>
                  <h3 className="text-lg font-bold text-slate-900">Configure AI API Key</h3>
                  <p className="text-xs text-slate-500 mt-1">
                    Supports Groq, OpenRouter, OpenAI, Anthropic, Google Gemini, and <strong>any OpenAI-compatible endpoint</strong>.
                  </p>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">Provider</label>
                  <select
                    value={apiProvider}
                    onChange={e => setApiProvider(e.target.value)}
                    className="w-full p-3 border border-slate-300 rounded-xl text-sm bg-white font-medium"
                  >
                    <option value="auto">Auto-detect from key</option>
                    <option value="groq">Groq (gsk_…)</option>
                    <option value="openrouter">OpenRouter (sk-or-…)</option>
                    <option value="openai">OpenAI (sk-…)</option>
                    <option value="anthropic">Anthropic Claude (sk-ant-…)</option>
                    <option value="gemini">Google Gemini (AIza…)</option>
                    <option value="custom">Custom OpenAI-compatible (any key format)</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">API Key</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={e => setApiKey(e.target.value)}
                    placeholder="Paste your API key here..."
                    className="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono bg-slate-50"
                  />
                  {apiKey && (
                    <p className="text-[11px] text-slate-500 mt-1">
                      Detected format: <strong>{detectProvider(apiKey)}</strong>
                      {apiProvider === 'auto' && detectProvider(apiKey) === 'custom' && (
                        <span className="text-amber-700"> — unrecognized prefix; select <em>Custom OpenAI-compatible</em> below.</span>
                      )}
                    </p>
                  )}
                </div>

                {apiProvider === 'custom' && (
                  <div className="space-y-3 bg-indigo-50/60 border border-indigo-100 p-4 rounded-xl">
                    <div>
                      <label className="block text-xs font-bold text-indigo-900 mb-1">Base URL</label>
                      <input
                        type="text"
                        value={apiBaseUrl}
                        onChange={e => setApiBaseUrl(e.target.value)}
                        placeholder="e.g. https://open.bigmodel.cn/api/paas/v4"
                        className="w-full p-2.5 border border-indigo-200 rounded-lg text-sm font-mono bg-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-indigo-900 mb-1">Model Name</label>
                      <input
                        type="text"
                        value={apiModel}
                        onChange={e => setApiModel(e.target.value)}
                        placeholder="e.g. glm-4-flash, deepseek-chat, mistral-small-latest"
                        className="w-full p-2.5 border border-indigo-200 rounded-lg text-sm font-mono bg-white"
                      />
                    </div>
                    <p className="text-[11px] text-indigo-700 leading-snug">
                      Find your provider's <strong>"OpenAI-compatible"</strong> endpoint. Common examples:
                      <br />• <strong>Zhipu:</strong> <code>https://open.bigmodel.cn/api/paas/v4</code> + <code>glm-4-flash</code>
                      <br />• <strong>DeepSeek:</strong> <code>https://api.deepseek.com/v1</code> + <code>deepseek-chat</code>
                      <br />• <strong>Mistral:</strong> <code>https://api.mistral.ai/v1</code> + <code>mistral-small-latest</code>
                      <br />• <strong>Together:</strong> <code>https://api.together.xyz/v1</code> + <code>meta-llama/Llama-3.3-70B-Instruct-Turbo</code>
                    </p>
                  </div>
                )}

                <p className="text-[11px] text-amber-700 bg-amber-50 border border-amber-200 p-2 rounded-lg">
                  ⚠️ Key is stored in <code>localStorage</code> on this device only. Do not use shared machines.
                </p>

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={() => { handleClearApiKey(); setShowApiKeyModal(false); }}
                    className="px-3 py-2 text-xs font-bold text-rose-600 hover:text-rose-800"
                  >
                    Clear Key
                  </button>
                  <div className="flex space-x-3">
                    <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                    <button
                      onClick={() => { handleSaveApiKey(apiKey, apiProvider, apiBaseUrl, apiModel); setShowApiKeyModal(false); }}
                      className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow"
                    >
                      Save Key
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
