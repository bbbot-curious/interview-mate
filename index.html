<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewMate — AI Question & Evaluation Generator</title>
    <!-- Tailwind CSS & React CDN Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      @media print {
        header, nav, button, .no-print { display: none !important; }
        body { background: white !important; color: black !important; }
        .print-card { border: 1px solid #cbd5e1 !important; box-shadow: none !important; break-inside: avoid; }
      }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DEPARTMENTS & POSITIONS DATA ---
    const DEPARTMENT_POSITIONS = {
      'Information Technology': ['Software Engineer', 'Senior Full Stack Developer', 'Frontend Developer', 'Backend Architect', 'DevOps Engineer', 'Data Analyst', 'Systems Administrator', 'Cybersecurity Specialist', 'Product Manager'],
      'Human Resources': ['HR Manager', 'Talent Acquisition Specialist', 'HR Business Partner', 'Recruiter', 'Compensation & Benefits Analyst', 'People Operations Lead'],
      'Finance & Accounting': ['Financial Analyst', 'Senior Accountant', 'Finance Manager', 'Internal Auditor', 'Payroll Specialist', 'Controller'],
      'Marketing': ['Digital Marketing Specialist', 'Content Marketing Manager', 'SEO & SEM Specialist', 'Brand Manager', 'Growth Marketing Lead'],
      'Sales': ['Sales Executive', 'Account Manager', 'Business Development Manager', 'Enterprise Account Executive', 'Sales Operations Analyst'],
      'Operations': ['Operations Manager', 'Supply Chain Analyst', 'Logistics Coordinator', 'Process Improvement Specialist', 'Project Manager'],
      'Customer Service': ['Customer Support Specialist', 'Customer Success Manager', 'Support Team Lead', 'Client Relations Manager'],
      'Administration': ['Executive Assistant', 'Office Manager', 'Administrative Assistant', 'Operations Assistant'],
      'Engineering': ['Mechanical Engineer', 'Electrical Engineer', 'QA Automation Engineer', 'Civil Engineer', 'Chemical Engineer'],
      'Other / Custom': ['Custom Position']
    };

    const SENIORITY_LEVELS = ['Internship', 'Entry Level', 'Junior', 'Mid-Level', 'Senior', 'Manager', 'Director / Executive'];
    const INTERVIEW_TYPES = ['General Interview', 'Technical Interview', 'Behavioral Interview', 'Competency-Based Interview', 'Situational Interview', 'Leadership Interview'];
    const QUESTION_COUNTS = [5, 10, 15, 20];

    const SCRUTINY_LEVELS = [
      { id: 'lenient', title: 'Lenient / Encouraging', desc: 'Generous scoring (3-5). Gives benefit of the doubt for junior roles.', badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'balanced', title: 'Balanced (Standard Corp)', desc: 'Standard corporate evaluation. Requires clear STAR examples for 4+.', badgeBg: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'strict', title: 'Strict (High-Bar Senior)', desc: 'High expectations. Caps vague or unquantified answers at 2 or 3.', badgeBg: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'ruthless', title: 'Ruthless (Bar Raiser)', desc: 'Extremely rigorous. Scores 4 and 5 reserved strictly for top candidates.', badgeBg: 'bg-rose-50 text-rose-700 border-rose-200' }
    ];

    const DEFAULT_PRESETS = [
      { id: 'preset-1', title: 'Senior Frontend Developer', department: 'Information Technology', position: 'Frontend Developer', seniority: 'Senior', interviewType: 'Technical Interview', questionCount: 5, additionalContext: 'Focus on React 18, TypeScript, System Architecture, and Web Performance.' },
      { id: 'preset-2', title: 'HR Business Partner', department: 'Human Resources', position: 'HR Business Partner', seniority: 'Mid-Level', interviewType: 'Behavioral Interview', questionCount: 5, additionalContext: 'Focus on Conflict Resolution, Leadership Coaching, and Talent Retention.' },
      { id: 'preset-3', title: 'Financial Analyst', department: 'Finance & Accounting', position: 'Financial Analyst', seniority: 'Mid-Level', interviewType: 'Competency-Based Interview', questionCount: 5, additionalContext: 'Financial Modeling, DCF Valuation, Budget Forecasting, and Advanced Excel.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [studioViewMode, setStudioViewMode] = useState('studio'); // 'studio' | 'compact'
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('interviewmate_gemini_key') || '');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [scrutinyMode, setScrutinyMode] = useState('balanced');
      const [copyStatus, setCopyStatus] = useState('');
      
      const [presets, setPresets] = useState(() => {
        const saved = localStorage.getItem('interviewmate_presets');
        return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
      });

      const [config, setConfig] = useState({
        department: 'Information Technology',
        position: 'Software Engineer',
        customPosition: '',
        seniority: 'Mid-Level',
        interviewType: 'Technical Interview',
        questionCount: 5,
        additionalContext: ''
      });

      const [generatedKit, setGeneratedKit] = useState(null);
      const [candidateScores, setCandidateScores] = useState({});
      const [candidateNotes, setCandidateNotes] = useState({});
      const [candidateInfo, setCandidateInfo] = useState({ candidateName: '', interviewerName: '', interviewDate: new Date().toISOString().split('T')[0] });
      const [aiAnswerReviews, setAiAnswerReviews] = useState({});
      const [reviewingIndex, setReviewingIndex] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('interviewmate_gemini_key', key);
      };

      const handleScoreChange = (qIndex, score) => {
        setCandidateScores(prev => ({ ...prev, [qIndex]: score }));
      };

      const handleNoteChange = (qIndex, note) => {
        setCandidateNotes(prev => ({ ...prev, [qIndex]: note }));
      };

      // Copy all questions & rubrics to clipboard
      const handleCopyAllQuestions = () => {
        if (!generatedKit) return;
        let formattedText = `INTERVIEWS QUESTION KIT & RUBRICS\nPosition: ${generatedKit.position} (${generatedKit.seniority})\nInterview Type: ${config.interviewType}\nGenerated: ${new Date().toLocaleDateString()}\n\n`;
        
        generatedKit.questions.forEach((q, idx) => {
          formattedText += `Q${idx + 1} [${q.category}]: ${q.question}\n`;
          formattedText += `Purpose: ${q.purpose}\n`;
          formattedText += `Green Flags: ${q.greenFlags ? q.greenFlags.join('; ') : 'N/A'}\n`;
          formattedText += `Red Flags: ${q.redFlags ? q.redFlags.join('; ') : 'N/A'}\n`;
          formattedText += `Rubric:\n  Score 1: ${q.rubricMatrix?.[1] || 'Poor'}\n  Score 3: ${q.rubricMatrix?.[3] || 'Meets Expectations'}\n  Score 5: ${q.rubricMatrix?.[5] || 'Exceptional'}\n`;
          formattedText += `--------------------------------------------------\n\n`;
        });

        navigator.clipboard.writeText(formattedText).then(() => {
          setCopyStatus('Copied to clipboard!');
          setTimeout(() => setCopyStatus(''), 3000);
        });
      };

      const computeOverallStats = useMemo(() => {
        const scores = Object.values(candidateScores).filter(s => typeof s === 'number');
        if (scores.length === 0) return { avgScore: '0.0', count: 0, recommendation: 'Pending Ratings' };
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / scores.length).toFixed(1);
        
        let recommendation = 'Not Recommended';
        if (avg >= 4.5) recommendation = 'Strongly Recommended';
        else if (avg >= 3.6) recommendation = 'Recommended';
        else if (avg >= 2.8) recommendation = 'Further Evaluation Needed';

        return { avgScore: avg, count: scores.length, recommendation };
      }, [candidateScores]);

      // Call Gemini API or fallback
      const generateInterviewQuestions = async () => {
        setIsGenerating(true);
        const targetPosition = config.department === 'Other / Custom' ? (config.customPosition || 'Custom Role') : config.position;

        if (apiKey) {
          try {
            const prompt = `Generate an interview question kit for a ${config.seniority} level ${targetPosition} in the ${config.department} department.
Interview Type: ${config.interviewType}
Number of questions: ${config.questionCount}
Additional Context: ${config.additionalContext}

Return ONLY valid JSON matching this structure:
{
  "questions": [
    {
      "id": "q1",
      "category": "Technical",
      "question": "Question text here",
      "purpose": "Purpose of question",
      "greenFlags": ["Indicator 1", "Indicator 2"],
      "redFlags": ["Warning sign 1", "Warning sign 2"],
      "rubricMatrix": {
        "1": "Description for Poor (1)",
        "3": "Description for Meets Expectations (3)",
        "5": "Description for Excellent (5)"
      }
    }
  ]
}`;

            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await res.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            const cleanedJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
            const parsed = JSON.parse(cleanedJson);

            setGeneratedKit({
              position: targetPosition,
              seniority: config.seniority,
              questions: parsed.questions
            });
            setActiveTab('studio');
            setIsGenerating(false);
            return;
          } catch (err) {
            console.warn("AI Generation failed or fallback triggered:", err);
          }
        }

        // Offline Fallback Generator
        setTimeout(() => {
          setGeneratedKit({
            position: targetPosition,
            seniority: config.seniority,
            questions: Array.from({ length: config.questionCount }).map((_, i) => ({
              id: `q-${i+1}`,
              category: i % 2 === 0 ? 'Technical / Job-Specific' : 'Behavioral & Problem Solving',
              question: `[Demo Q${i+1}] Describe a scenario where you demonstrated core leadership and analytical skills as a ${config.seniority} ${targetPosition}.`,
              purpose: `Evaluates real-world competencies and methodology for ${targetPosition}.`,
              greenFlags: ['Articulates specific STAR framework examples', 'Quantifies impact with hard business metrics'],
              redFlags: ['Gives generic high-level answers', 'Avoids taking personal accountability'],
              rubricMatrix: {
                1: 'Vague, no concrete examples provided.',
                3: 'Clear answer with basic methodology demonstrated.',
                5: 'Exceptional response with quantifiable ROI and clear execution steps.'
              }
            }))
          });
          setActiveTab('studio');
          setIsGenerating(false);
        }, 1200);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar — Spacious & Modern */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-md">
            <div className="max-w-7xl mx-auto px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">M</div>
                <div>
                  <h1 className="font-bold text-lg leading-tight tracking-wide">InterviewMate</h1>
                  <p className="text-xs text-slate-400">AI Questions & Candidate Scorecards</p>
                </div>
              </div>

              {/* Navigation Phase Links */}
              <nav className="flex items-center space-x-2 text-sm font-medium overflow-x-auto py-1">
                <button onClick={() => setActiveTab('dashboard')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>Dashboard</button>
                <button onClick={() => setActiveTab('generator')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'generator' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>1. Generator</button>
                <button onClick={() => setActiveTab('studio')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'studio' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>2. Question Studio</button>
                <button onClick={() => setActiveTab('live-interview')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'live-interview' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>3. Live Interview</button>
                <button onClick={() => setActiveTab('scorecard')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'scorecard' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>4. Scorecard</button>
                <button onClick={() => setActiveTab('about')} className={`px-3.5 py-2 rounded-xl transition ${activeTab === 'about' ? 'bg-indigo-600 text-white font-bold shadow' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>About & Guide</button>
              </nav>

              <button onClick={() => setShowApiKeyModal(true)} className="px-3.5 py-2 rounded-xl border border-slate-700 hover:border-slate-500 text-xs font-semibold flex items-center space-x-2 text-slate-300 transition bg-slate-800/60">
                <span className={`w-2.5 h-2.5 rounded-full ${apiKey ? 'bg-emerald-400 shadow-sm' : 'bg-amber-400'}`}></span>
                <span>{apiKey ? 'API Key Active' : 'Set Gemini Key'}</span>
              </button>
            </div>
          </header>

          {/* Main Content Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-6 py-8">

            {/* DASHBOARD TAB */}
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="bg-gradient-to-r from-indigo-900 via-slate-900 to-slate-900 text-white p-8 rounded-3xl shadow-xl border border-slate-800">
                  <h2 className="text-3xl font-extrabold mb-3">Structured Hiring Made Effortless</h2>
                  <p className="text-slate-300 max-w-2xl mb-6 text-sm leading-relaxed">Generate tailored interview questions, dynamic rubrics, and high-objectivity candidate scorecards backed by Gemini AI.</p>
                  <button onClick={() => setActiveTab('generator')} className="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">Create New Interview Set →</button>
                </div>

                <div>
                  <h3 className="text-xl font-bold text-slate-900 mb-4">Quick Launch Presets</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {presets.map(p => (
                      <div key={p.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <span className="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md">{p.department}</span>
                        <h4 className="font-bold text-slate-900 text-lg mt-3">{p.title}</h4>
                        <p className="text-xs text-slate-500 mt-1">{p.seniority} • {p.interviewType}</p>
                        <button onClick={() => {
                          setConfig({ ...config, department: p.department, position: p.position, seniority: p.seniority, interviewType: p.interviewType, additionalContext: p.additionalContext });
                          setActiveTab('generator');
                        }} className="mt-6 w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl transition">Use Preset</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* GENERATOR TAB */}
            {activeTab === 'generator' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-3xl mx-auto space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">Configure Interview Requirements</h2>
                  <p className="text-xs text-slate-500 mt-1">Select position parameters to generate customized interview questions and rubrics.</p>
                </div>

                <div className="space-y-6">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-2">Department</label>
                    <select value={config.department} onChange={e => setConfig({ ...config, department: e.target.value, position: DEPARTMENT_POSITIONS[e.target.value][0] })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-medium">
                      {Object.keys(DEPARTMENT_POSITIONS).map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-2">Position Title</label>
                    <select value={config.position} onChange={e => setConfig({ ...config, position: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-medium">
                      {DEPARTMENT_POSITIONS[config.department]?.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-2">Seniority</label>
                      <select value={config.seniority} onChange={e => setConfig({ ...config, seniority: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-medium">
                        {SENIORITY_LEVELS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-2">Interview Type</label>
                      <select value={config.interviewType} onChange={e => setConfig({ ...config, interviewType: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-medium">
                        {INTERVIEW_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-2">Questions Count</label>
                      <select value={config.questionCount} onChange={e => setConfig({ ...config, questionCount: Number(e.target.value) })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-sm font-medium">
                        {QUESTION_COUNTS.map(c => <option key={c} value={c}>{c} Questions</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-2">Additional Context / Special Requirements</label>
                    <textarea value={config.additionalContext} onChange={e => setConfig({ ...config, additionalContext: e.target.value })} placeholder="e.g. Focus on microservices architecture, React 18, high concurrency, and team conflict resolution..." className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 h-28 text-sm" />
                  </div>

                  <button onClick={generateInterviewQuestions} disabled={isGenerating} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-400 text-white font-bold rounded-xl shadow-lg transition">
                    {isGenerating ? 'Generating Question Kit...' : 'Generate Questions & Rubrics →'}
                  </button>
                </div>
              </div>
            )}

            {/* QUESTION STUDIO TAB (With Compact & Print View) */}
            {activeTab === 'studio' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-4 no-print">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Question Studio & Rubrics</h2>
                    <p className="text-xs text-slate-500">{config.position} ({config.seniority}) • {config.interviewType}</p>
                  </div>

                  <div className="flex items-center space-x-3">
                    {/* View Switcher Button */}
                    <div className="bg-slate-100 p-1 rounded-xl flex space-x-1 text-xs font-bold">
                      <button onClick={() => setStudioViewMode('studio')} className={`px-3 py-1.5 rounded-lg transition ${studioViewMode === 'studio' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'}`}>Studio Mode</button>
                      <button onClick={() => setStudioViewMode('compact')} className={`px-3 py-1.5 rounded-lg transition ${studioViewMode === 'compact' ? 'bg-white text-indigo-600 shadow' : 'text-slate-500'}`}>Compact / Print View</button>
                    </div>

                    <button onClick={handleCopyAllQuestions} className="px-3.5 py-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold rounded-xl shadow transition">
                      {copyStatus || 'Copy All Text'}
                    </button>
                    <button onClick={() => window.print()} className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow transition">
                      Print Document
                    </button>
                  </div>
                </div>

                {generatedKit ? (
                  studioViewMode === 'studio' ? (
                    // Interactive Studio View
                    <div className="space-y-6">
                      {generatedKit.questions.map((q, idx) => (
                        <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                          <div className="flex justify-between items-start">
                            <span className="text-xs font-bold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md">Q{idx + 1} • {q.category}</span>
                            <span className="text-xs text-slate-400">{q.purpose}</span>
                          </div>
                          <h3 className="text-base font-bold text-slate-900">{q.question}</h3>

                          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs">
                            <div>
                              <span className="font-bold text-emerald-700 block mb-1">✓ Green Flags (Strong Answer)</span>
                              <ul className="list-disc list-inside text-slate-600 space-y-1">
                                {q.greenFlags?.map((g, i) => <li key={i}>{g}</li>)}
                              </ul>
                            </div>
                            <div>
                              <span className="font-bold text-rose-700 block mb-1">⚠ Red Flags (Warning Signs)</span>
                              <ul className="list-disc list-inside text-slate-600 space-y-1">
                                {q.redFlags?.map((r, i) => <li key={i}>{r}</li>)}
                              </ul>
                            </div>
                          </div>

                          <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-2 text-xs">
                            <span className="font-bold text-slate-700 block">Recommended Rubric Criteria:</span>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-2 text-slate-600">
                              <div className="bg-white p-2.5 rounded-lg border border-slate-200"><span className="font-bold text-rose-600 block">Score 1 (Poor):</span>{q.rubricMatrix?.[1] || 'Does not meet expectations'}</div>
                              <div className="bg-white p-2.5 rounded-lg border border-slate-200"><span className="font-bold text-amber-600 block">Score 3 (Meets):</span>{q.rubricMatrix?.[3] || 'Meets baseline expectations'}</div>
                              <div className="bg-white p-2.5 rounded-lg border border-slate-200"><span className="font-bold text-emerald-600 block">Score 5 (Excellent):</span>{q.rubricMatrix?.[5] || 'Exceptional demonstration'}</div>
                            </div>
                          </div>
                        </div>
                      ))}
                      <div className="flex justify-end no-print">
                        <button onClick={() => setActiveTab('live-interview')} className="px-8 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">Start Live Interview →</button>
                      </div>
                    </div>
                  ) : (
                    // Compact / Print Document View
                    <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6 print-card">
                      <div className="border-b border-slate-200 pb-4">
                        <h2 className="text-2xl font-black text-slate-900">{generatedKit.position} — Interview Guide</h2>
                        <p className="text-xs text-slate-500 mt-1">Seniority: {generatedKit.seniority} • Type: {config.interviewType} • Questions: {generatedKit.questions.length}</p>
                      </div>

                      <div className="space-y-6">
                        {generatedKit.questions.map((q, idx) => (
                          <div key={q.id} className="border-b border-slate-100 pb-6 space-y-2">
                            <div className="flex items-baseline justify-between">
                              <h3 className="font-bold text-slate-900 text-sm">Q{idx + 1}. {q.question}</h3>
                              <span className="text-xs font-medium text-slate-400">[{q.category}]</span>
                            </div>
                            <p className="text-xs text-slate-600 italic">Purpose: {q.purpose}</p>
                            
                            <div className="grid grid-cols-2 gap-4 text-xs mt-2">
                              <div><strong className="text-emerald-700">Green Flags:</strong> {q.greenFlags?.join('; ')}</div>
                              <div><strong className="text-rose-700">Red Flags:</strong> {q.redFlags?.join('; ')}</div>
                            </div>

                            <div className="text-xs bg-slate-50 p-3 rounded-lg border border-slate-200 mt-2">
                              <strong>Rubrics:</strong> [1-Poor]: {q.rubricMatrix?.[1]} | [3-Meets]: {q.rubricMatrix?.[3]} | [5-Excellent]: {q.rubricMatrix?.[5]}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )
                ) : (
                  <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-500">No question set generated yet.</div>
                )}
              </div>
            )}

            {/* LIVE INTERVIEW STUDIO */}
            {activeTab === 'live-interview' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Live Interview Studio</h2>
                    <p className="text-xs text-slate-500">{config.position} ({config.seniority}) • {config.interviewType}</p>
                  </div>

                  {/* Scrutiny Selector */}
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-slate-500">AI Scrutiny Mode:</span>
                    <select value={scrutinyMode} onChange={e => setScrutinyMode(e.target.value)} className="text-xs font-bold p-2 rounded-xl border border-slate-300 bg-slate-50">
                      {SCRUTINY_LEVELS.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                </div>

                {generatedKit ? (
                  <div className="space-y-6">
                    {generatedKit.questions.map((q, idx) => (
                      <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md">Q{idx + 1} • {q.category}</span>
                          <span className="text-xs text-slate-400">{q.purpose}</span>
                        </div>
                        <h3 className="text-base font-bold text-slate-900">{q.question}</h3>

                        {/* Interactive 1-5 Scoring */}
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-2">Score Candidate Response (1 to 5):</label>
                          <div className="flex space-x-2">
                            {[1, 2, 3, 4, 5].map(score => (
                              <button key={score} onClick={() => handleScoreChange(idx, score)} className={`flex-1 py-2 rounded-xl font-bold text-xs transition ${candidateScores[idx] === score ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>{score}</button>
                            ))}
                          </div>
                        </div>

                        {/* Notes & AI Answer Review */}
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Interviewer Notes & Answer Transcript:</label>
                          <textarea value={candidateNotes[idx] || ''} onChange={e => handleNoteChange(idx, e.target.value)} placeholder="Record candidate response notes here..." className="w-full p-3 text-xs border border-slate-200 rounded-xl bg-slate-50 h-24" />
                        </div>
                      </div>
                    ))}

                    <div className="flex justify-end">
                      <button onClick={() => setActiveTab('scorecard')} className="px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition">View Candidate Scorecard →</button>
                    </div>
                  </div>
                ) : (
                  <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-500">No active interview session.</div>
                )}
              </div>
            )}

            {/* CANDIDATE SCORECARD TAB */}
            {activeTab === 'scorecard' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-4xl mx-auto space-y-8 print-card">
                <div className="border-b border-slate-200 pb-6 flex justify-between items-start">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">Candidate Evaluation Scorecard</h2>
                    <p className="text-xs text-slate-500 mt-1">{config.position} ({config.seniority})</p>
                  </div>
                  <div className="text-right">
                    <span className="text-3xl font-black text-indigo-600">{computeOverallStats.avgScore} / 5.0</span>
                    <p className="text-xs font-bold text-slate-400">Average Candidate Rating</p>
                  </div>
                </div>

                <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-indigo-500 uppercase tracking-wider">Automated Recommendation</span>
                    <h3 className="text-xl font-black text-indigo-950 mt-1">{computeOverallStats.recommendation}</h3>
                  </div>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow transition no-print">Print Candidate PDF</button>
                </div>

                {/* 3 Strengths & 3 Areas to Improve */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100 space-y-3">
                    <h4 className="font-bold text-emerald-900 text-sm">Top 3 Identified Strengths</h4>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#StructuredExecution:</span><span>Demonstrates clear methodology in problem decomposition.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#DomainExpertise:</span><span>Strong baseline technical knowledge aligned with job criteria.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#Communication:</span><span>Articulates technical choices directly without excessive jargon.</span></li>
                    </ul>
                  </div>

                  <div className="bg-rose-50/50 p-6 rounded-2xl border border-rose-100 space-y-3">
                    <h4 className="font-bold text-rose-900 text-sm">Top 3 Areas for Improvement</h4>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#QuantifiedMetrics:</span><span>Could provide more hard business impact data in examples.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#EdgeCaseHandling:</span><span>Deeper elaboration needed for risk mitigation strategies.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#DelegationDepth:</span><span>Tends to focus heavily on individual effort rather than team scale.</span></li>
                    </ul>
                  </div>
                </div>
              </div>
            )}

            {/* ABOUT & GUIDE TAB */}
            {activeTab === 'about' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-4xl mx-auto space-y-8">
                <div>
                  <h2 className="text-2xl font-black text-slate-900">About InterviewMate & User Guide</h2>
                  <p className="text-xs text-slate-500 mt-1">AI-powered interview question generator and structured evaluation platform.</p>
                </div>

                <div className="space-y-6 text-sm text-slate-600 leading-relaxed">
                  <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 space-y-3">
                    <h3 className="font-bold text-slate-900 text-base">Application Workflow</h3>
                    <ol className="list-decimal list-inside space-y-2 text-xs">
                      <li><strong>Configure:</strong> Select department, position, seniority level, and interview type in <em>1. Generator</em>.</li>
                      <li><strong>Review & Edit:</strong> Review generated questions and evaluation rubrics in <em>2. Question Studio</em>. Switch to Compact View for printing or quick text copying.</li>
                      <li><strong>Conduct Interview:</strong> Log candidate response notes and score answers (1–5) in <em>3. Live Interview</em> using calibrated AI scrutiny modes.</li>
                      <li><strong>Finalize Scorecard:</strong> Access the candidate evaluation scorecard and export print summaries in <em>4. Scorecard</em>.</li>
                    </ol>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div className="bg-indigo-50/50 p-6 rounded-2xl border border-indigo-100 space-y-2">
                      <h4 className="font-bold text-indigo-950 text-sm">Gemini API Key Privacy</h4>
                      <p className="text-xs text-indigo-900">Your Google AI Studio API key is stored strictly inside your browser's local storage (`localStorage`). It is never transmitted to any third-party server—only directly to Google's official Gemini API endpoints.</p>
                    </div>

                    <div className="bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100 space-y-2">
                      <h4 className="font-bold text-emerald-950 text-sm">4-Tier AI Scrutiny Dial</h4>
                      <p className="text-xs text-emerald-900">Prevent rating inflation by selecting between Lenient, Balanced, Strict, and Ruthless (Bar Raiser) evaluation modes depending on job seniority demands.</p>
                    </div>
                  </div>

                  {/* Encouraging Closing Card */}
                  <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-6 rounded-2xl text-center space-y-2 shadow-md">
                    <p className="text-lg font-bold">Semangat ya ❤️ 🥨</p>
                    <p className="text-xs text-slate-300">Good luck with your structured interview sessions!</p>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Configure Gemini API Key</h3>
                <p className="text-xs text-slate-500">Get a free key at <strong>aistudio.google.com</strong>. Saved strictly in your local browser storage.</p>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono bg-slate-50" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => { handleSaveApiKey(apiKey); setShowApiKeyModal(false); }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Key</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
