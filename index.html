<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InterviewMate — AI Question & Evaluation Generator</title>
    <!-- Tailwind CSS & React CDN Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- DEPARTMENTS & POSITIONS DATA ---
    const DEPARTMENT_POSITIONS = {
      'Information Technology': ['Software Engineer', 'Senior Full Stack Developer', 'Frontend Developer', 'Backend Architect', 'DevOps Engineer', 'Data Analyst', 'Systems Administrator', 'Cybersecurity Specialist', 'Product Manager'],
      'Human Resources': ['HR Manager', 'Talent Acquisition Specialist', 'HR Business Partner', 'Recruiter', 'Compensation & Benefits Analyst', 'People Operations Lead'],
      'Finance & Accounting': ['Financial Analyst', 'Senior Accountant', 'Finance Manager', 'Internal Auditor', 'Payroll Specialist', 'Controller'],
      'Marketing': ['Digital Marketing Specialist', 'Content Marketing Manager', 'SEO & SEM Specialist', 'Brand Manager', 'Growth Marketing Lead'],
      'Sales': ['Sales Executive', 'Account Manager', 'Business Development Manager', 'Enterprise Account Executive', 'Sales Operations Analyst'],
      'Operations': ['Operations Manager', 'Supply Chain Analyst', 'Logistics Coordinator', 'Process Improvement Specialist', 'Project Manager'],
      'Customer Service': ['Customer Support Specialist', 'Customer Success Manager', 'Support Team Lead', 'Client Relations Manager'],
      'Administration': ['Executive Assistant', 'Office Manager', 'Administrative Assistant', 'Operations Assistant'],
      'Engineering': ['Mechanical Engineer', 'Electrical Engineer', 'QA Automation Engineer', 'Civil Engineer', 'Chemical Engineer'],
      'Other / Custom': ['Custom Position']
    };

    const SENIORITY_LEVELS = ['Internship', 'Entry Level', 'Junior', 'Mid-Level', 'Senior', 'Manager', 'Director / Executive'];
    const INTERVIEW_TYPES = ['General Interview', 'Technical Interview', 'Behavioral Interview', 'Competency-Based Interview', 'Situational Interview', 'Leadership Interview'];
    const QUESTION_COUNTS = [5, 10, 15, 20];

    const SCRUTINY_LEVELS = [
      { id: 'lenient', title: 'Lenient / Encouraging', desc: 'Generous scoring (3-5). Gives benefit of the doubt for junior roles.', badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
      { id: 'balanced', title: 'Balanced (Standard Corp)', desc: 'Standard corporate evaluation. Requires clear STAR examples for 4+.', badgeBg: 'bg-blue-50 text-blue-700 border-blue-200' },
      { id: 'strict', title: 'Strict (High-Bar Senior)', desc: 'High expectations. Caps vague or unquantified answers at 2 or 3.', badgeBg: 'bg-amber-50 text-amber-700 border-amber-200' },
      { id: 'ruthless', title: 'Ruthless (Bar Raiser)', desc: 'Extremely rigorous. Scores 4 and 5 reserved strictly for top candidates.', badgeBg: 'bg-rose-50 text-rose-700 border-rose-200' }
    ];

    const DEFAULT_PRESETS = [
      { id: 'preset-1', title: 'Senior Frontend Developer', department: 'Information Technology', position: 'Frontend Developer', seniority: 'Senior', interviewType: 'Technical Interview', questionCount: 5, additionalContext: 'Focus on React 18, TypeScript, System Architecture, and Web Performance.' },
      { id: 'preset-2', title: 'HR Business Partner', department: 'Human Resources', position: 'HR Business Partner', seniority: 'Mid-Level', interviewType: 'Behavioral Interview', questionCount: 5, additionalContext: 'Focus on Conflict Resolution, Leadership Coaching, and Talent Retention.' },
      { id: 'preset-3', title: 'Financial Analyst', department: 'Finance & Accounting', position: 'Financial Analyst', seniority: 'Mid-Level', interviewType: 'Competency-Based Interview', questionCount: 5, additionalContext: 'Financial Modeling, DCF Valuation, Budget Forecasting, and Advanced Excel.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('interviewmate_gemini_key') || '');
      const [showApiKeyModal, setShowApiKeyModal] = useState(false);
      const [scrutinyMode, setScrutinyMode] = useState('balanced');
      
      const [presets, setPresets] = useState(() => {
        const saved = localStorage.getItem('interviewmate_presets');
        return saved ? JSON.parse(saved) : DEFAULT_PRESETS;
      });

      const [config, setConfig] = useState({
        department: 'Information Technology',
        position: 'Software Engineer',
        customPosition: '',
        seniority: 'Mid-Level',
        interviewType: 'Technical Interview',
        questionCount: 5,
        additionalContext: ''
      });

      const [generatedKit, setGeneratedKit] = useState(null);
      const [candidateScores, setCandidateScores] = useState({});
      const [candidateNotes, setCandidateNotes] = useState({});
      const [candidateInfo, setCandidateInfo] = useState({ candidateName: '', interviewerName: '', interviewDate: new Date().toISOString().split('T')[0] });
      const [aiAnswerReviews, setAiAnswerReviews] = useState({});
      const [reviewingIndex, setReviewingIndex] = useState(null);
      const [isGenerating, setIsGenerating] = useState(false);

      const handleSaveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('interviewmate_gemini_key', key);
      };

      const handleScoreChange = (qIndex, score) => {
        setCandidateScores(prev => ({ ...prev, [qIndex]: score }));
      };

      const handleNoteChange = (qIndex, note) => {
        setCandidateNotes(prev => ({ ...prev, [qIndex]: note }));
      };

      const computeOverallStats = useMemo(() => {
        const scores = Object.values(candidateScores).filter(s => typeof s === 'number');
        if (scores.length === 0) return { avgScore: 0, count: 0, recommendation: 'Pending Ratings' };
        const sum = scores.reduce((acc, curr) => acc + curr, 0);
        const avg = (sum / scores.length).toFixed(1);
        
        let recommendation = 'Not Recommended';
        if (avg >= 4.5) recommendation = 'Strongly Recommended';
        else if (avg >= 3.6) recommendation = 'Recommended';
        else if (avg >= 2.8) recommendation = 'Further Evaluation Needed';

        return { avgScore: avg, count: scores.length, recommendation };
      }, [candidateScores]);

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header Bar */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('dashboard')}>
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-lg">M</div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">InterviewMate</h1>
                  <p className="text-xs text-slate-400">AI Questions & Candidate Scorecards</p>
                </div>
              </div>

              {/* Navigation Phase Links */}
              <nav className="hidden md:flex space-x-1 text-sm font-medium">
                <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>Dashboard</button>
                <button onClick={() => setActiveTab('generator')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'generator' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>1. Generate Questions</button>
                <button onClick={() => setActiveTab('live-interview')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'live-interview' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>2. Live Interview</button>
                <button onClick={() => setActiveTab('scorecard')} className={`px-3 py-2 rounded-lg transition ${activeTab === 'scorecard' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-800'}`}>3. Candidate Scorecard</button>
              </nav>

              <button onClick={() => setShowApiKeyModal(true)} className="px-3 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 text-xs flex items-center space-x-2 text-slate-300">
                <span className={`w-2 h-2 rounded-full ${apiKey ? 'bg-emerald-400' : 'bg-amber-400'}`}></span>
                <span>{apiKey ? 'API Key Active' : 'Set Gemini Key'}</span>
              </button>
            </div>
          </header>

          {/* Main Workspace */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            {activeTab === 'dashboard' && (
              <div className="space-y-8">
                <div className="bg-gradient-to-r from-indigo-900 to-slate-900 text-white p-8 rounded-3xl shadow-xl">
                  <h2 className="text-3xl font-extrabold mb-3">Structured Hiring Made Effortless</h2>
                  <p className="text-slate-300 max-w-2xl mb-6">Generate tailored interview questions, dynamic rubrics, and high-objectivity candidate scorecards backed by Gemini AI.</p>
                  <button onClick={() => setActiveTab('generator')} className="px-6 py-3 bg-indigo-500 hover:bg-indigo-400 text-white font-semibold rounded-xl shadow-lg transition">Create New Interview Set →</button>
                </div>

                <div>
                  <h3 className="text-xl font-bold text-slate-900 mb-4">Quick Launch Presets</h3>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {presets.map(p => (
                      <div key={p.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition">
                        <span className="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md">{p.department}</span>
                        <h4 className="font-bold text-slate-900 text-lg mt-3">{p.title}</h4>
                        <p className="text-xs text-slate-500 mt-1">{p.seniority} • {p.interviewType}</p>
                        <button onClick={() => {
                          setConfig({ ...config, department: p.department, position: p.position, seniority: p.seniority, interviewType: p.interviewType, additionalContext: p.additionalContext });
                          setActiveTab('generator');
                        }} className="mt-6 w-full py-2 bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium rounded-xl transition">Use Preset</button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'generator' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-3xl mx-auto">
                <h2 className="text-2xl font-bold text-slate-900 mb-6">Configure Interview Requirements</h2>
                <div className="space-y-6">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Department</label>
                    <select value={config.department} onChange={e => setConfig({ ...config, department: e.target.value, position: DEPARTMENT_POSITIONS[e.target.value][0] })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50">
                      {Object.keys(DEPARTMENT_POSITIONS).map(d => <option key={d} value={d}>{d}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Position Title</label>
                    <select value={config.position} onChange={e => setConfig({ ...config, position: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50">
                      {DEPARTMENT_POSITIONS[config.department]?.map(p => <option key={p} value={p}>{p}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-2">Seniority</label>
                      <select value={config.seniority} onChange={e => setConfig({ ...config, seniority: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50">
                        {SENIORITY_LEVELS.map(s => <option key={s} value={s}>{s}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-2">Interview Type</label>
                      <select value={config.interviewType} onChange={e => setConfig({ ...config, interviewType: e.target.value })} className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50">
                        {INTERVIEW_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Additional Requirements / Context</label>
                    <textarea value={config.additionalContext} onChange={e => setConfig({ ...config, additionalContext: e.target.value })} placeholder="e.g. Focus on microservices, React 18 state management, leadership under pressure..." className="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 h-28" />
                  </div>

                  <button onClick={() => {
                    // Demo questions payload
                    setGeneratedKit({
                      position: config.position,
                      seniority: config.seniority,
                      questions: [
                        {
                          id: 'q1',
                          category: 'Technical',
                          question: `Describe a recent complex project in ${config.position} where you solved a major bottleneck.`,
                          purpose: 'Evaluates problem-solving efficiency and system architecture understanding.',
                          greenFlags: ['Explicit STAR details', 'Clear metrics and impact'],
                          redFlags: ['Vague general answers', 'Blames team members'],
                          rubricMatrix: { 1: 'No clear answer', 3: 'Basic overview', 5: 'Detailed STAR answer with quantifiable impact' }
                        },
                        {
                          id: 'q2',
                          category: 'Behavioral',
                          question: 'How do you prioritize competing deadlines when stakeholders have conflicting requirements?',
                          purpose: 'Assesses stakeholder management and prioritization skills.',
                          greenFlags: ['Structured triage process', 'Proactive communication'],
                          redFlags: ['Says yes to everything', 'Avoids conflict'],
                          rubricMatrix: { 1: 'Pushes responsibility to others', 3: 'Manages baseline conflicts', 5: 'Executive level alignment and framework' }
                        }
                      ]
                    });
                    setActiveTab('live-interview');
                  }} className="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition">Generate Interview Questions</button>
                </div>
              </div>
            )}

            {activeTab === 'live-interview' && (
              <div className="space-y-6">
                <div className="bg-white p-6 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">Live Interview Studio</h2>
                    <p className="text-sm text-slate-500">{config.position} ({config.seniority}) • {config.interviewType}</p>
                  </div>

                  {/* Scrutiny Selector */}
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-semibold text-slate-500">AI Scrutiny:</span>
                    <select value={scrutinyMode} onChange={e => setScrutinyMode(e.target.value)} className="text-xs font-semibold p-2 rounded-lg border border-slate-300 bg-slate-50">
                      {SCRUTINY_LEVELS.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                    </select>
                  </div>
                </div>

                {generatedKit ? (
                  <div className="space-y-8">
                    {generatedKit.questions.map((q, idx) => (
                      <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-700 rounded-md">Q{idx + 1} • {q.category}</span>
                          <span className="text-xs text-slate-400">{q.purpose}</span>
                        </div>
                        <h3 className="text-lg font-bold text-slate-900">{q.question}</h3>

                        {/* Evaluation Rubrics */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs">
                          <div>
                            <span className="font-bold text-emerald-700 block mb-1">✓ Green Flags (Strong Answer)</span>
                            <ul className="list-disc list-inside text-slate-600 space-y-1">
                              {q.greenFlags?.map((g, i) => <li key={i}>{g}</li>)}
                            </ul>
                          </div>
                          <div>
                            <span className="font-bold text-rose-700 block mb-1">⚠ Red Flags (Warning Signs)</span>
                            <ul className="list-disc list-inside text-slate-600 space-y-1">
                              {q.redFlags?.map((r, i) => <li key={i}>{r}</li>)}
                            </ul>
                          </div>
                        </div>

                        {/* Interactive 1-5 Scoring */}
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-2">Score Candidate Answer (1 to 5):</label>
                          <div className="flex space-x-2">
                            {[1, 2, 3, 4, 5].map(score => (
                              <button key={score} onClick={() => handleScoreChange(idx, score)} className={`flex-1 py-2.5 rounded-xl font-bold text-sm transition ${candidateScores[idx] === score ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}`}>{score}</button>
                            ))}
                          </div>
                        </div>

                        {/* Candidate Transcript & Notes */}
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">Interviewer Notes & Answer Transcript:</label>
                          <textarea value={candidateNotes[idx] || ''} onChange={e => handleNoteChange(idx, e.target.value)} placeholder="Record candidate's answer notes, key points, or quotes here..." className="w-full p-3 text-sm border border-slate-200 rounded-xl bg-slate-50 h-24" />
                        </div>
                      </div>
                    ))}

                    <div className="flex justify-end">
                      <button onClick={() => setActiveTab('scorecard')} className="px-8 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-lg transition">View Candidate Scorecard →</button>
                    </div>
                  </div>
                ) : (
                  <div className="bg-white p-12 text-center rounded-2xl border border-slate-200 text-slate-500">
                    No questions generated yet. Click <strong>Generate Questions</strong> to start.
                  </div>
                )}
              </div>
            )}

            {activeTab === 'scorecard' && (
              <div className="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-4xl mx-auto space-y-8">
                <div className="border-b border-slate-200 pb-6 flex justify-between items-start">
                  <div>
                    <h2 className="text-2xl font-black text-slate-900">Candidate Evaluation Scorecard</h2>
                    <p className="text-sm text-slate-500">{config.position} ({config.seniority})</p>
                  </div>
                  <div className="text-right">
                    <span className="text-3xl font-black text-indigo-600">{computeOverallStats.avgScore} / 5.0</span>
                    <p className="text-xs font-bold text-slate-400">Average Candidate Rating</p>
                  </div>
                </div>

                {/* Overall Recommendation Banner */}
                <div className="bg-indigo-50 border border-indigo-100 p-6 rounded-2xl flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-indigo-500 uppercase tracking-wider">Automated Recommendation</span>
                    <h3 className="text-xl font-black text-indigo-950 mt-1">{computeOverallStats.recommendation}</h3>
                  </div>
                  <button onClick={() => window.print()} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl shadow transition">Print PDF Summary</button>
                </div>

                {/* 3 Strengths & 3 Areas to Improve */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-emerald-50/50 p-6 rounded-2xl border border-emerald-100">
                    <h4 className="font-bold text-emerald-900 text-sm mb-3">Top 3 Identified Strengths</h4>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#StructuredExecution:</span><span>Demonstrates clear methodology in problem decomposition.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#DomainExpertise:</span><span>Strong baseline knowledge aligned with job criteria.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-emerald-600 font-bold">#Communication:</span><span>Articulates technical choices directly without excessive jargon.</span></li>
                    </ul>
                  </div>

                  <div className="bg-rose-50/50 p-6 rounded-2xl border border-rose-100">
                    <h4 className="font-bold text-rose-900 text-sm mb-3">Top 3 Areas for Improvement</h4>
                    <ul className="space-y-2 text-xs text-slate-700">
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#QuantifiedMetrics:</span><span>Could provide more hard business impact data in examples.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#EdgeCaseHandling:</span><span>Deeper elaboration needed for risk mitigation strategies.</span></li>
                      <li className="flex items-start space-x-2"><span className="text-rose-600 font-bold">#DelegationDepth:</span><span>Tends to focus heavily on individual effort rather than team scale.</span></li>
                    </ul>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* API Key Modal */}
          {showApiKeyModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white max-w-md w-full p-6 rounded-3xl shadow-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-900">Configure Gemini API Key</h3>
                <p className="text-xs text-slate-500">Your key is saved locally in your browser's LocalStorage and is never transmitted to external servers.</p>
                <input type="password" value={apiKey} onChange={e => setApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-3 border border-slate-300 rounded-xl text-sm font-mono bg-slate-50" />
                <div className="flex justify-end space-x-3">
                  <button onClick={() => setShowApiKeyModal(false)} className="px-4 py-2 text-xs font-bold text-slate-500">Cancel</button>
                  <button onClick={() => { handleSaveApiKey(apiKey); setShowApiKeyModal(false); }} className="px-5 py-2 bg-indigo-600 text-white text-xs font-bold rounded-xl shadow">Save Key</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
